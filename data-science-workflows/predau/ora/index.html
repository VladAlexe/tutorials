<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ora · Predau · Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/sistem.css?v=36">
<link rel="stylesheet" href="../../css/predau.css?v=36">
<script src="../../js/tema.js?v=36"></script>
</head>
<body>

<div id="antet" data-aici="Ora" data-predau></div>

<main class="pd">
  <div id="banda"></div>
  <div id="corp">
    <div class="sch sch--c" style="height:150px"></div>
  </div>
</main>

<script type="module" src="../../js/antet.js?v=36"></script>
<script type="module">
/* ===========================================================================
   AL DOILEA ECRAN

   Pagina asta e o OGLINDĂ. Nu are niciun buton care schimbă ora.

   Înainte avea nouă: înainte, înapoi, proiector, mod, închide ora, plus
   săgețile de la tastatură. Erau aceleași comenzi care există în banda din
   lecție, deci aceeași oră avea două volane și nu știai la care să te uiți.
   De acolo venea senzația de complicat, nu din numărul butoanelor.

   Acum conduci din lecție, întotdeauna, iar aici doar te uiți: cine ce a ales
   pe slide-ul care e chiar acum pe proiector. Se mișcă singură după tine.

   Ce desenează e același cod cu sertarul din lecție (tasta P): js/panou-live.js.
   O singură randare, două locuri.
   =========================================================================== */

import { RADACINA, LECTII } from "../../js/curs.js?v=36";
import * as O from "../../js/ora.js?v=36";
import * as P from "../../js/panou-live.js?v=36";

const PAS = 4000;
const el = id => document.getElementById(id);

let A;
try { A = await import("../../js/auth.js?v=36"); }
catch { el("corp").textContent = "Nu pot încărca autentificarea."; throw 0; }

const p = await A.profil();
if (!p.autentificat){ location.replace(`${RADACINA}/intra/?spre=${encodeURIComponent(location.pathname)}`); throw 0; }
if (!p.profesorReal){ location.replace(`${RADACINA}/cont/`); throw 0; }

P.stil();

let S = await O.deschisa();

if (!S){
  el("banda").innerHTML = `<div class="st"><span class="st__pct"></span>
    <span class="st__t">Nicio oră deschisă</span>
    <span class="st__d">oglinda asta arată ce se întâmplă într-o ședință; întâi pornește una</span></div>`;
  el("corp").innerHTML = `<div class="gol">
    <p class="gol__t">Nu e nicio oră în desfășurare</p>
    <p class="gol__d">Ora se pornește din lecție, de la butonul din banda de jos.
      Cum pornește, pagina asta se umple singură.</p>
    <a class="btn btn--tare" href="../">Lecțiile</a></div>`;
  throw 0;
}

const H = await O.harta(S.capitol);
let sortare = "slide";
let slideVechi = S.slide_nr;
let dinCand = Date.now();

deseneazaBanda();
reimprospateaza();
setInterval(() => { if (!document.hidden) reimprospateaza(); }, PAS);
setInterval(() => {
  if (document.hidden) return;
  const c = document.querySelector(".pv__n");
  if (c) c.textContent = `slide-ul de pe ecran · ${P.ceasText((Date.now() - dinCand) / 1000)}`;
}, 1000);

function nrDe(c){ return parseInt(String(c).replace("c",""), 10); }

/* --- banda de sus ----------------------------------------------------------
   Spune ce oră e deschisă și unde ești, și atât. Singurul link de aici e
   înapoi în lecție, pentru că acolo se conduce. */

function deseneazaBanda(){
  const lectie = (LECTII.find(l => l.nr === nrDe(S.capitol)) || LECTII[0]).cheie;
  el("banda").innerHTML = `
    <div class="st st--viu">
      <span class="st__pct"></span>
      <span class="st__t">Live</span>
      <span class="st__cod" style="cursor:default">${S.cod || "—"}</span>
      <span class="st__d">${S.titlu} · slide ${S.slide_nr}${
        S.total_nr ? ` din ${S.total_nr}` : ""} · ${S.in_clasa} au lucrat</span>
      <span class="st__sp"></span>
      <a class="btn btn--mic" href="${RADACINA}/${lectie}/lectie/">Înapoi în lecție</a>
    </div>`;
}

/* --- ce se întâmplă acum --------------------------------------------------- */

async function reimprospateaza(){
  const proaspat = await O.deschisa();
  if (!proaspat){ location.reload(); return; }
  S = { ...S, ...proaspat };

  if (S.slide_nr !== slideVechi){ slideVechi = S.slide_nr; dinCand = Date.now(); }

  const sarcini = O.sarciniDe(H, S.slide_nr);
  const randuri = await O.panou(S.id, sarcini.map(x => x.id)) || [];

  deseneazaBanda();
  el("corp").innerHTML = P.randeaza({
    slide: (H?.slide || []).find(x => x.nr === S.slide_nr) || null,
    sarcini, randuri, sortare,
    secunde: (Date.now() - dinCand) / 1000,
    totalSarcini: H?.sarcini || null
  }) + blocaj(randuri);

  P.legaSortarea(el("corp"), s => { sortare = s; reimprospateaza(); });
}

/* --- blocații acum ---------------------------------------------------------
   O singură linie, nu un raport. Panoul nu e pentru după oră, e pentru
   următoarele treizeci de secunde. */

function blocaj(randuri){
  const goi = randuri.filter(x => x.stare === "trimis_gol");
  const plecati = randuri.filter(x => x.vazut_la &&
                   (Date.now() - new Date(x.vazut_la)) > 180000);
  if (!goi.length && !plecati.length) return "";
  const b = [];
  if (goi.length) b.push(`${goi.map(x => x.nume).join(", ")} ${goi.length === 1 ? "a trimis" : "au trimis"} gol`);
  if (plecati.length) b.push(`${plecati.map(x => x.nume).join(", ")} ${plecati.length === 1 ? "nu mai e" : "nu mai sunt"} pe pagină`);
  return `<div class="blocaj"><b>Acum</b><span>${b.join(" · ")}</span></div>`;
}
</script>
</body>
</html>
