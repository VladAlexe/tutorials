<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ședințele · Predau · Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/sistem.css?v=41">
<link rel="stylesheet" href="../../css/predau.css?v=41">
<script src="../../js/tema.js?v=41"></script>
</head>
<body>

<div id="antet" data-aici="Ședințele" data-predau></div>

<main class="pd">
  <div class="pd__cap">
    <div>
      <p class="pd__et" id="et">Predau</p>
      <h1 class="pd__t" id="titlu">Ședințele</h1>
      <p class="pd__d" id="sub">Istoricul cursului. Fiecare oră cu raportul ei,
        exportul ei, și butonul de arhivare.</p>
    </div>
  </div>
  <div id="corp"><div class="sch sch--r"></div><div class="sch sch--r"></div></div>
</main>

<script type="module" src="../../js/antet.js?v=41"></script>
<script type="module">
/* ===========================================================================
   ȘEDINȚELE, ȘI RAPORTUL UNEIA

   Două vederi ale aceluiași lucru, nu două pagini: lista, și o ședință
   deschisă din listă. Adresa poartă `?id=`, deci raportul se poate trimite.

   Ștergerea nu e definitivă pe loc. Butonul pe care îl apeși în grabă, la
   sfârșitul orei, e cel care NU distruge nimic: arhivează. Ștergerea de tot
   stă în arhivă, cu o confirmare adevărată.
   =========================================================================== */

import { RADACINA, LECTII } from "../../js/curs.js?v=41";
import * as O from "../../js/ora.js?v=41";

const el = id => document.getElementById(id);
const LUNI = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie",
              "august","septembrie","octombrie","noiembrie","decembrie"];
const ZILE = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];

let A;
try { A = await import("../../js/auth.js?v=41"); }
catch { el("corp").textContent = "Nu pot încărca autentificarea."; throw 0; }

const p = await A.profil();
if (!p.autentificat){ location.replace(`${RADACINA}/intra/?spre=${encodeURIComponent(location.pathname)}`); throw 0; }
if (!p.profesorReal){ location.replace(`${RADACINA}/cont/`); throw 0; }

const id = new URLSearchParams(location.search).get("id");
id ? unaSingura(id) : toate();

/* --- lista ---------------------------------------------------------------- */

async function toate(){
  const [vii, arhivate] = await Promise.all([O.lista(false), O.lista(true)]);

  if (!vii?.length && !arhivate?.length){
    el("corp").innerHTML = `<div class="gol">
      <p class="gol__t">Nicio ședință încă</p>
      <p class="gol__d">Lista asta e istoricul cursului. Se umple singură, cum
        pornești prima oră.</p>
      <a class="btn btn--tare" href="../">Pornește ora</a></div>`;
    return;
  }

  el("corp").innerHTML = `
    ${vii?.length ? `<ul class="sed">${vii.map(rand).join("")}</ul>` : `
      <div class="gol"><p class="gol__t">Nicio ședință activă</p>
      <p class="gol__d">Toate sunt arhivate.</p>
      <a class="btn btn--tare" href="../">Pornește ora</a></div>`}

    ${arhivate?.length ? `
      <h2 class="pd__t" style="font-size:19px;margin:40px 0 4px">Arhivate</h2>
      <p class="pd__d" style="margin:0 0 14px">Ies din liste și din statistici
        imediat, dar rămân 30 de zile. Un clic le aduce înapoi, întregi.</p>
      <ul class="sed">${arhivate.map(rand).join("")}</ul>` : ""}`;

  document.querySelectorAll("[data-arh]").forEach(b => b.onclick = async () => {
    await O.arhiveaza(b.dataset.arh, b.dataset.inapoi === "1");
    toate();
  });
}

function rand(s){
  const arh = s.zile_ramase != null;
  return `<li>
    <div>
      <p class="sed__t">${s.titlu}</p>
      <p class="sed__d">${dataLunga(s.deschisa_la)} · ${s.minute} min ·
        ${s.prezenti} prezenți
        ${s.inchisa_la ? "" : " · <strong>deschisă</strong>"}
        ${arh ? ` · se șterge în ${s.zile_ramase} zile` : ""}</p>
    </div>
    <div class="sed__a">
      <a class="btn btn--mic" href="?id=${s.id}">Raportul</a>
      <button class="btn btn--mic" data-arh="${s.id}" data-inapoi="${arh ? 1 : 0}"
        ${arh ? "" : `style="color:var(--nu);border-color:color-mix(in srgb,var(--nu) 32%,var(--linie))"`}>
        ${arh ? "Adu înapoi" : "Arhivează"}</button>
    </div>
  </li>`;
}

/* --- raportul unei ședințe ------------------------------------------------- */

async function unaSingura(id){
  const [r, randuri] = await Promise.all([O.raport(id), O.sumar(id)]);
  if (!r?.ok){
    el("corp").innerHTML = `<div class="gol"><p class="gol__t">Ședința nu există</p>
      <p class="gol__d">Poate a fost ștearsă din arhivă.</p>
      <a class="btn" href="./">Toate ședințele</a></div>`;
    return;
  }

  el("et").innerHTML = `<a class="leg" href="./">Ședințele</a> · raport`;
  el("titlu").textContent = r.titlu;
  el("sub").textContent = r.inchisa_la
    ? "Ședință închisă. Ce scrie aici nu se mai schimbă."
    : "Ședința e încă deschisă, deci cifrele se mai mișcă.";

  const li = (LECTII.find(l => l.nr === parseInt(String(r.capitol).replace("c",""),10)) || {}).cheie;

  el("corp").innerHTML = `
    <div class="st ${r.inchisa_la ? "" : "st--viu"}">
      <span class="st__pct"></span>
      <span class="st__t">${r.inchisa_la ? "Închisă" : "Deschisă"}</span>
      <span class="st__d">${dataLunga(r.deschisa_la)}${r.inchisa_la
        ? ` – ${ora(r.inchisa_la)}` : ""} · ${r.minute} min ·
        ${r.grupa || "—"}</span>
    </div>

    <div class="cif">
      <div class="cif__c"><p class="cif__n">${r.prezenti}<small>/${r.inscrisi || "—"}</small></p>
        <p class="cif__e">prezenți, din înscriși</p></div>
      <div class="cif__c"><p class="cif__n">${r.intrati}<small>/${r.inscrisi || "—"}</small></p>
        <p class="cif__e">au intrat în oră</p></div>
      <div class="cif__c"><p class="cif__n">${r.sarcini_atinse}<small>/${total(r.capitol)}</small></p>
        <p class="cif__e">sarcini atinse</p></div>
      <div class="cif__c"><p class="cif__n">${r.texte}</p>
        <p class="cif__e">texte scrise de ei</p></div>
    </div>

    ${r.impotmolire ? `<div class="card" style="margin-bottom:26px">
      <p class="card__et">unde s-a împotmolit grupa</p>
      <p class="card__t">${r.impotmolire.sarcina}</p>
      <p class="card__d">Doar ${r.impotmolire.trecuti} din ${r.impotmolire.din} au trecut-o.
        ${li ? `<a class="leg" href="${RADACINA}/${li}/lectie/">Deschide lecția</a>` : ""}</p>
    </div>` : ""}

    <h2 class="pd__t" style="font-size:19px;margin:0 0 12px">Cine ce a făcut</h2>
    ${tabel(randuri, id)}

    <div class="randb" style="margin-top:24px">
      <button class="btn btn--tare" id="bt-csv" type="button">Export CSV</button>
      <a class="btn" href="./">Toate ședințele</a>
      <a class="btn" href="../semestru/?l=${li || ""}">Semestrul</a>
      <button class="btn" id="bt-arh" type="button"
        style="color:var(--nu);border-color:color-mix(in srgb,var(--nu) 32%,var(--linie))">Arhivează</button>
    </div>`;

  el("bt-csv").onclick = () => csv(r, randuri);
  el("bt-arh").onclick = async () => { await O.arhiveaza(id); location.href = "./"; };
  document.querySelectorAll("[data-prez]").forEach(b => b.onclick = async () => {
    await O.punePrezenta(id, b.dataset.prez, b.dataset.val === "1");
    unaSingura(id);
  });
}

function tabel(randuri, id){
  if (!randuri?.length) return `<div class="gol">
    <p class="gol__t">Nimeni n-a trimis nimic</p>
    <p class="gol__d">Ori ora n-a apucat să înceapă, ori nimeni nu a intrat cu
      contul. Prezența se ia din activitate, deci e goală și ea.</p></div>`;

  return `<table class="tb">
    <thead><tr><th>Student</th><th>Prezent</th><th>Trimise</th><th>Trecute</th>
      <th style="text-align:right">A intrat</th></tr></thead>
    <tbody>${randuri.map(x => `<tr>
      <td>${x.nume}</td>
      <td><button class="btn btn--mic" data-prez="${x.matricol}" data-val="${x.prezent ? 0 : 1}"
            title="${x.prezent ? "Scoate prezența" : "Pune prezența"}">
          <span class="g ${x.prezent ? "g--ok" : "g--nim"}">${x.prezent ? "✓" : "○"}</span>
          ${x.prezent ? "prezent" : "absent"}</button></td>
      <td class="rap">${x.trimise}</td>
      <td class="rap">${x.trecute}</td>
      <td style="text-align:right" class="rap">${x.prima ? ora(x.prima) : "—"}</td>
    </tr>`).join("")}</tbody></table>
    <p class="rap" style="margin:11px 0 0">Prezența e calculată din activitate:
      cine a trimis cel puțin o sarcină. Se poate răsturna cu un clic.</p>`;
}

function total(capitol){
  const l = LECTII.find(x => x.nr === parseInt(String(capitol).replace("c",""),10));
  return l?.sarcini ?? "—";
}

/* --- export ---------------------------------------------------------------
   Un CSV pe ședință. Cu punct și virgulă, pentru că Excel în română așa
   desface coloanele, și cu BOM, ca diacriticele să nu se strice. */

function csv(r, randuri){
  const cap = ["matricol","nume","prezent","trimise","trecute","prima_activitate"];
  const linii = [cap.join(";")].concat((randuri||[]).map(x =>
    [x.matricol, x.nume, x.prezent ? "da" : "nu", x.trimise, x.trecute,
     x.prima || ""].map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")));
  const text = "﻿" + linii.join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type:"text/csv;charset=utf-8" }));
  a.download = `${r.capitol}-${(r.deschisa_la||"").slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* --- date ------------------------------------------------------------------ */

function dataLunga(t){
  const d = new Date(t);
  return `${ZILE[d.getDay()]}, ${d.getDate()} ${LUNI[d.getMonth()]}, ${ora(t)}`;
}
function ora(t){
  const d = new Date(t);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
</script>
</body>
</html>
