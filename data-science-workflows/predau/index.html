<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog · Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../css/fonturi.css?v=87">
<link rel="stylesheet" href="../css/sistem.css?v=87">
<link rel="stylesheet" href="../css/panou.css?v=87">
<link rel="stylesheet" href="../css/predau.css?v=87">
<script src="../js/tema.js?v=87"></script>
<style>
  /* ==========================================================================
     PANOUL PROFESORULUI

     Trei întrebări, trei file:
       Catalogul   cum stă fiecare student: prezență, activitate, teme,
                   proiect, nota. Aici pui și notele tale.
       Lecțiile    ce s-a întâmplat la fiecare lecție: când ai predat-o, cine a
                   fost, ce au rezolvat, unde s-au împotmolit, ce au scris.
       Orele       istoricul orelor, cu raportul fiecăreia.
     Un clic pe numele unui student deschide fișa lui, cu tot.
     ========================================================================== */
  .pd{max-width:1240px}
  .pp__cap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 16px}
  .pp__et{font-family:var(--sans);font-size:var(--t1);color:var(--ambra);margin:0 0 6px}
  .pp__t{font-family:var(--sans);font-size:var(--t6);font-weight:600;letter-spacing:-.022em;margin:0}

  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:4px 0 20px}
  .kpi__c{border:1px solid var(--linie);border-radius:10px;background:var(--panza);padding:12px 15px}
  .kpi__n{font-family:var(--sans);font-size:var(--t6);font-weight:600;letter-spacing:-.02em;margin:0;color:var(--text)}
  .kpi__n small{font-size:var(--t2);color:var(--text-3);font-weight:500}
  .kpi__e{font-family:var(--sans);font-size:var(--t1);color:var(--text-2);margin:2px 0 0}
  .kpi__c:nth-child(1) .kpi__n{color:var(--accent-text)}

  .file2{display:flex;gap:2px;border-bottom:1px solid var(--linie);margin:0 0 18px}
  .file2 a{font-family:var(--sans);font-size:var(--t2);font-weight:500;color:var(--text-2);text-decoration:none;
    padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .file2 a:hover{color:var(--text)}
  .file2 a.on{color:var(--text);border-bottom-color:var(--ambra)}
  .vedere[hidden]{display:none}

  .unelte{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .unelte input[type=search]{font-family:var(--sans);font-size:var(--t2);padding:7px 11px;border-radius:8px;
    border:1px solid var(--linie-2);background:var(--panza);color:var(--text);min-width:220px}
  .unelte .sp{flex:1}
  .nota-mica{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);margin:10px 0 0;max-width:80ch}

  /* catalogul */
  .cat__sul{overflow:auto;border:1px solid var(--linie);border-radius:10px;background:var(--panza);max-height:72vh}
  .cat{border-collapse:separate;border-spacing:0;width:100%;font-family:var(--sans);font-size:var(--t2)}
  .cat th{position:sticky;top:0;z-index:2;background:var(--panza);text-align:center;font-family:var(--sans);
    font-weight:500;font-size:var(--t1);color:var(--text-3);
    padding:9px 6px;border-bottom:1px solid var(--linie);white-space:nowrap}
  .cat th small{display:block;letter-spacing:0;text-transform:none;font-size:var(--t1);color:var(--text-3)}
  .cat th.cs,.cat td.cs{text-align:left;position:sticky;left:0;z-index:1;background:var(--panza);
    padding-left:14px;min-width:190px;border-right:1px solid var(--linie)}
  .cat th.cs{z-index:3}
  .cat th[data-sort]{cursor:pointer}
  .cat th[data-sort]:hover{color:var(--text)}
  .cat td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--linie);white-space:nowrap}
  .cat tr:last-child td{border-bottom:0}
  .cat tbody tr:hover td{background:var(--panza-2)}
  .cat td.cs button{all:unset;cursor:pointer;font-weight:500;color:var(--text)}
  .cat td.cs button:hover{color:var(--accent-text);text-decoration:underline}
  .cat td.cs .mic{display:block;margin-top:1px}
  .cat .sep{border-left:1px solid var(--linie)}
  .pz{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--linie-2)}
  .pz--da{background:var(--accent);border-color:var(--accent)}
  .pz--nu{border-style:dashed;opacity:.8}
  .pz--np{border:0;background:none;color:var(--text-3);width:auto;height:auto;font-size:var(--t1)}
  .cat input.n{width:52px;font-family:var(--mono);font-size:var(--t1);text-align:center;padding:4px 4px;
    border:1px solid var(--linie);border-radius:6px;background:var(--fundal);color:var(--text)}
  .cat input.n:focus{outline:none;border-color:var(--ambra);box-shadow:0 0 0 2px var(--ambra-slab)}
  .cat input.n.salvat{border-color:var(--ok)}
  .cat input.n.rau{border-color:var(--nu)}
  .cat .act{font-family:var(--sans);font-size:var(--t1)}
  .cat .tot{font-family:var(--sans);font-size:var(--t2);font-weight:600;color:var(--text)}
  .cat .bara{display:inline-block;width:46px;height:4px;border-radius:9px;background:var(--panza-2);overflow:hidden;vertical-align:middle;margin-left:6px}
  .cat .bara i{display:block;height:100%;background:var(--ambra)}
  .eticheta{display:inline-block;font-family:var(--sans);font-size:var(--t1);padding:1px 6px;border-radius:9px;
    border:1px solid var(--linie-2);color:var(--text-3);margin-left:6px;vertical-align:1px}

  /* lecțiile */
  .lec2{display:flex;flex-direction:column;border:1px solid var(--linie);border-radius:10px;background:var(--panza);overflow:hidden}
  .lec2__r{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 170px auto;gap:12px;align-items:center;
    padding:12px 16px;border-top:1px solid var(--linie)}
  .lec2__r:first-child{border-top:0}
  .lec2__nr{font-family:var(--sans);font-size:var(--t2);color:var(--accent-text);font-weight:500}
  .lec2__t{font-family:var(--sans);font-size:var(--t3);font-weight:600;color:var(--text)}
  .lec2__d{font-family:var(--sans);font-size:var(--t1);color:var(--text-2)}
  .lec2__r.nepredata .lec2__t,.lec2__r.nepredata .lec2__nr{color:var(--text-3)}
  .lec2__det{grid-column:1/-1;padding:16px 0 4px;border-top:1px dashed var(--linie-2);margin-top:6px}
  .lec2__det[hidden]{display:none}
  .lec2__det h3{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);
    margin:18px 0 10px;font-weight:500}
  .lec2__det h3:first-child{margin-top:0}
  @media(max-width:900px){.lec2__r{grid-template-columns:36px minmax(0,1fr) auto}.lec2__r .ascunde{display:none}}

  /* orele */
  .sed__rap{grid-column:1/-1;width:100%;max-width:none;margin-top:14px;padding-top:16px;border-top:1px dashed var(--linie-2)}
  .sed__rap[hidden]{display:none}
  details.arh{margin-top:18px}
  details.arh summary{cursor:pointer;font-family:var(--sans);font-size:var(--t1);color:var(--text-2);padding:6px 0}

  .st--viu{border-color:color-mix(in srgb,var(--ambra) 40%,var(--linie));background:var(--ambra-slab);margin-bottom:14px}
  .st--viu .st__pct{background:var(--ambra);box-shadow:0 0 0 3px color-mix(in srgb,var(--ambra) 22%,transparent)}
  .gol-s{font-family:var(--sans);font-size:var(--t2);color:var(--text-3);padding:12px 0;margin:0}

  .grupe{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .grupa{font-family:var(--sans);font-size:var(--t2);font-weight:500;padding:7px 14px;border-radius:20px;cursor:pointer;
    border:1px solid var(--linie-2);background:var(--panza);color:var(--text-2)}
  .grupa small{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);margin-left:4px}
  .grupa:hover{color:var(--text);border-color:var(--text-3)}
  .grupa.on{background:var(--ambra);border-color:var(--ambra);color:#fff}
  .grupa.on small{color:rgba(255,255,255,.8)}
  .btn-sterge{color:var(--nu);border-color:color-mix(in srgb,var(--nu) 35%,var(--linie))}

  .obs-b{all:unset;cursor:pointer;color:var(--text-3);font-size:var(--t2);padding:2px 6px;border-radius:6px}
  .obs-b:hover{background:var(--panza-2);color:var(--text)}
  .obs-b.are{color:var(--ambra)}
  .fisa__in{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .fisa__in label{display:flex;flex-direction:column;gap:4px;font-family:var(--sans);font-size:var(--t1);color:var(--text-2)}
  .fisa__in label small{font-family:var(--sans);font-size:var(--t1);color:var(--text-3)}
  .fisa__in input.n{width:100%;font-family:var(--mono);font-size:var(--t2);text-align:center;padding:7px;border:1px solid var(--linie-2);
    border-radius:8px;background:var(--panza);color:var(--text)}
  .fisa__in input.n.salvat{border-color:var(--ok)} .fisa__in input.n.rau{border-color:var(--nu)}
  .fisa__obs{width:100%;font-family:var(--sans);font-size:var(--t2);line-height:1.5;padding:10px 12px;border:1px solid var(--linie-2);
    border-radius:9px;background:var(--panza);color:var(--text);resize:vertical}
  .fisa__obs:focus{outline:none;border-color:var(--ambra);box-shadow:0 0 0 2px var(--ambra-slab)}
  .lec2__h{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);margin:18px 0 10px;font-weight:500}
  .tabla2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}

  /* fișa studentului */
  .fisa-fundal{position:fixed;inset:0;background:rgba(20,20,15,.32);z-index:80}
  .fisa{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--fundal);z-index:81;
    border-left:1px solid var(--linie);overflow-y:auto;padding:22px 24px 40px;box-shadow:var(--umbra)}
  .fisa__x{position:absolute;top:14px;right:16px}
  .fisa h2{font-family:var(--sans);font-size:var(--t5);margin:0 0 4px}
  .fisa__m{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);margin:0 0 6px}
  .fisa__cont{font-family:var(--sans);font-size:var(--t2);color:var(--text-2);margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .fisa h3{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);
    margin:22px 0 10px;font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--linie)}
  .fisa__note{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fisa__n{border:1px solid var(--linie);border-radius:9px;background:var(--panza);padding:10px 12px}
  .fisa__n b{display:block;font-family:var(--sans);font-size:var(--t5);font-weight:600}
  .fisa__n span{font-family:var(--sans);font-size:var(--t1);color:var(--text-2)}
  .fisa__l{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;
    border-bottom:1px solid var(--linie);font-family:var(--sans);font-size:var(--t2)}
  .fisa__l .mic{font-size:var(--t1)}
</style>
</head>
<body>

<div id="antet" data-aici="Catalog" data-predau></div>

<main class="pd">
  <div class="pp__cap">
    <div>
      <p class="pp__et" id="ziua">Predau</p>
      <h1 class="pp__t">Catalog</h1>
    </div>
  </div>

  <div id="acum"></div>
  <div class="grupe" id="grupe"></div>
  <div class="kpi" id="kpi"></div>

  <nav class="file2" id="file">
    <a href="#catalog" data-v="catalog">Catalogul</a>
    <a href="#lectii" data-v="lectii">Lecțiile</a>
    <a href="#ore" data-v="ore">Orele</a>
    <a href="#echipe" data-v="echipe">Echipele</a>
  </nav>

  <section class="vedere" data-v="catalog">
    <div class="unelte">
      <input type="search" id="caut" placeholder="Caută un student" aria-label="Caută un student">
      <span class="sp"></span>
      <button class="btn btn--mic" type="button" id="bt-csv">Export CSV</button>
    </div>
    <div id="cat"><div class="sch sch--r"></div></div>
    <p class="nota-mica" id="cat-leg"></p>
  </section>

  <section class="vedere" data-v="lectii" hidden>
    <div id="lectii"><div class="sch sch--r"></div></div>
  </section>

  <section class="vedere" data-v="ore" hidden>
    <div id="ore-corp"><div class="sch sch--r"></div></div>
  </section>

  <section class="vedere" data-v="echipe" hidden>
    <div id="echipe-corp"><div class="sch sch--r"></div></div>
  </section>
</main>

<div id="subsol"></div>

<script type="module" src="../js/antet.js?v=87"></script>
<script type="module" src="../js/subsol.js?v=87"></script>
<script type="module">
import { RADACINA, LECTII, NOTARE, activitate } from "../js/curs.js?v=87";
import * as O from "../js/ora.js?v=87";

const el  = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const ZILE = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const LUNI = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const nr2 = v => (Math.round(v * 100) / 100).toFixed(2).replace(".", ",");
const lectiaDe = cap => LECTII.find(l => "c" + l.nr === cap);
const INV = "__invitati";

let A;
try { A = await import("../js/auth.js?v=87"); }
catch { el("cat").textContent = "Autentificarea nu a putut fi încărcată."; throw 0; }
const p = await A.profil().catch(() => ({}));
if (!p.autentificat || !p.profesorReal){ location.replace(`${RADACINA}/cont/`); throw 0; }
const sb = A.sb;

const d = new Date();
el("ziua").textContent = `${ZILE[d.getDay()]}, ${d.getDate()} ${LUNI[d.getMonth()]}`;

/* ---------------------------------------------------------------- notarea --
   Regula stă în js/curs.js (activitate): două șanse pe întrebare, una la oră
   și una acasă, contează doar primul răspuns din fiecare. Temele și proiectul
   le pui tu. Studentul vede exact aceeași cifră în contul lui. */
const PCT = Object.fromEntries(NOTARE.componente.map(c => [c.cheie, c.puncte]));
const TEMA = PCT.teme / 3;
const act = r => activitate(r.rezolvari);
function nota(r){
  const n = r.note || {};
  const a = act(r).total;
  const teme = ["tema1","tema2","tema3"].reduce((s, k) => s + (+n[k] || 0), 0);
  const proiect = +n.proiect || 0;
  return { act: a, teme, proiect, total: a + teme + proiect + (PCT.oficiu || 0) };
}

/* ------------------------------------------------------------------ date --- */
const rpc = (f, a) => sb.rpc(f, a).then(r => r.error ? { eroare: r.error.message } : r.data).catch(e => ({ eroare: e.message }));
const [catRaw, oreRaw, arhRaw, grupeRaw, viuStart, obsRaw] = await Promise.all([
  rpc("catalog"), rpc("ore_lista", { p_arhivate: false }), rpc("ore_lista", { p_arhivate: true }),
  O.grupe(), O.deschisa(), rpc("observatii")
]);
/* observațiile tale, pe student (db/21); fără tabel, câmpul spune ce lipsește */
const OBS = new Map((Array.isArray(obsRaw) ? obsRaw : []).map(o => [o.matricol, o.text]));
const areObs = Array.isArray(obsRaw);
const CAT_TOT = Array.isArray(catRaw) ? catRaw : [];
const ORE_TOT = Array.isArray(oreRaw) ? oreRaw : (await O.lista(false)) || [];
const ARH_TOT = Array.isArray(arhRaw) ? arhRaw : (await O.lista(true)) || [];
const vechi = !Array.isArray(catRaw) || CAT_TOT.some(r => !("rezolvari" in r));

/* ---------------------------------------------------------------- grupele ---
   Întâi alegi grupa, apoi tot ce vezi e doar despre ea: catalogul, lecțiile,
   orele. Toți invitații sunt o grupă a lor. Alegerea se ține minte. */
const GRUPE = (() => {
  const m = new Map();
  (grupeRaw || []).forEach(g => m.set(g.id, g.nume));
  CAT_TOT.filter(r => !r.invitat && r.grupa_id).forEach(r => { if (!m.has(r.grupa_id)) m.set(r.grupa_id, r.grupa || r.grupa_id); });
  const l = [...m.entries()].map(([id, nume]) => ({ id, nume, n: CAT_TOT.filter(r => !r.invitat && r.grupa_id === id).length }));
  const inv = CAT_TOT.filter(r => r.invitat).length;
  if (inv) l.push({ id: INV, nume: "Invitați", n: inv });
  const fara = CAT_TOT.filter(r => !r.invitat && !r.grupa_id).length;
  if (fara) l.push({ id: "", nume: "Fără grupă", n: fara });
  return l;
})();
let grupa = (() => { try { return localStorage.getItem("dsw.panou.grupa"); } catch { return null; } })();
if (viuStart?.grupa_id) grupa = viuStart.grupa_id;
if (!GRUPE.some(g => g.id === grupa)) grupa = GRUPE[0]?.id ?? "";

let CAT = [], ORE = [], ARH = [], predate = new Set();
function filtreaza(){
  CAT = CAT_TOT.filter(r => grupa === INV ? r.invitat : !r.invitat && (r.grupa_id || "") === grupa);
  const aOrei = s => grupa === INV || (s.grupa_id || "") === grupa || !("grupa_id" in s);
  ORE = ORE_TOT.filter(aOrei); ARH = ARH_TOT.filter(aOrei);
  predate = new Set(ORE.map(s => s.capitol));
}

function deseneazaGrupe(){
  el("grupe").innerHTML = GRUPE.length ? GRUPE.map(g => `
    <button type="button" class="grupa ${g.id === grupa ? "on" : ""}" data-g="${esc(g.id)}">
      ${esc(g.nume)} <small>${g.n}</small></button>`).join("")
    : `<span class="gol-s">Nu există încă nicio grupă: adaugă studenții în tabelul <code>studenti</code>, cu grupa fiecăruia.</span>`;
  el("grupe").querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    grupa = b.dataset.g;
    try { localStorage.setItem("dsw.panou.grupa", grupa); } catch {}
    totul();
  });
}

/* ------------------------------------------------------------------ acum --- */
async function acum(){
  const S = await O.deschisa();
  if (!S || O.prea_veche(S)){ el("acum").innerHTML = ""; return; }
  const l = lectiaDe(S.capitol);
  const H = await O.harta(S.capitol);
  const sarcini = O.sarciniDe(H, S.slide_nr || 1);
  const rand = await O.panou(S.id, sarcini.map(x => x.id)) || [];
  const vii = rand.filter(x => x.vazut_la && Date.now() - new Date(x.vazut_la) < 90000);
  const c = k => rand.filter(x => x.stare === k).length;
  el("acum").innerHTML = `<div class="st st--viu">
    <span class="st__pct"></span><span class="st__t">Oră în desfășurare · C${l?.nr ?? ""}${S.grupa ? " · " + esc(S.grupa) : ""}</span>
    <span class="st__d">codul <strong>${S.cod || "—"}</strong> · slide ${S.slide_nr || 1}${S.total_nr ? " din " + S.total_nr : ""}
      · <b>${vii.length}</b> în sală${sarcini.length ? ` · pe slide: ✓ ${c("trecut")} ✕ ${c("trimis_gresit")} ◉ ${c("trimis_gol")}` : ""}
      · de ${S.minute} min</span>
    <span class="st__sp"></span>
    <a class="btn btn--tare" href="${RADACINA}/${l?.cheie || ""}/lectie/#${S.slide_nr || 1}">Înapoi la oră</a></div>`;
}
acum();
setInterval(() => { if (!document.hidden) acum(); }, 6000);

/* ------------------------------------------------------------------- kpi --- */
function kpi(){
  const n = CAT.length;
  const prez = n && predate.size
    ? CAT.reduce((s, r) => s + (r.prezente || []).filter(c => predate.has(c)).length, 0) / (n * predate.size) : 0;
  const med = n ? CAT.reduce((s, r) => s + nota(r).total, 0) / n : 0;
  const faraCont = CAT.filter(r => !r.are_cont).length;
  el("kpi").innerHTML = `
    <div class="kpi__c"><p class="kpi__n">${predate.size}<small> / ${LECTII.length}</small></p><p class="kpi__e">lecții predate grupei</p></div>
    <div class="kpi__c"><p class="kpi__n">${n && predate.size ? Math.round(prez * 100) + "%" : "—"}</p><p class="kpi__e">prezența medie, la orele ținute</p></div>
    <div class="kpi__c"><p class="kpi__n">${n ? nr2(med) : "—"}<small> / ${NOTARE.total}</small></p><p class="kpi__e">punctajul mediu, până acum</p></div>
    <div class="kpi__c"><p class="kpi__n">${n}</p><p class="kpi__e">${grupa === INV ? "invitați" : "studenți"}${faraCont && grupa !== INV ? `, ${faraCont} încă fără cont` : ""}</p></div>`;
}

/* ------------------------------------------------------------------ file --- */
function arata(){
  const [v, arg] = (location.hash.slice(1) || "catalog").split("=");
  const vedere = ["catalog","lectii","ore","echipe"].includes(v) ? v : "catalog";
  document.querySelectorAll(".vedere").forEach(s => s.hidden = s.dataset.v !== vedere);
  document.querySelectorAll("#file a").forEach(a => a.classList.toggle("on", a.dataset.v === vedere));
  if (vedere === "echipe") echipe();
  if (v === "student" && arg) fisa(decodeURIComponent(arg)); else inchideFisa();
}
addEventListener("hashchange", arata);

/* ============================================================== CATALOGUL === */
let sortare = "nume", filtru = "";

function catalog(){
  if (vechi){
    el("cat").innerHTML = `<div class="gol"><p class="gol__t">Catalogul nu este configurat în baza de date</p>
      <p class="gol__d">Rulează o dată, în ordine, <code>db/18-catalog.sql</code> și <code>db/20-grupe-si-curatenie.sql</code>
      în Supabase (SQL Editor). ${esc(catRaw?.eroare || "")}</p></div>`;
    el("cat-leg").textContent = "";
    return;
  }
  if (!CAT.length){
    el("cat").innerHTML = `<div class="gol"><p class="gol__t">${grupa === INV ? "Niciun invitat" : "Grupa nu are studenți"}</p>
      <p class="gol__d">${grupa === INV ? "Invitații apar aici când intră la oră fără cont."
        : "Adaugă studenții grupei în tabelul <code>studenti</code> (matricol, nume, grupa_id), din SQL."}</p></div>`;
    el("cat-leg").textContent = "";
    return;
  }
  let r = CAT.map(x => ({ ...x, _n: nota(x) }))
             .filter(x => !filtru || (x.nume + " " + x.matricol).toLowerCase().includes(filtru));
  if (sortare === "total") r.sort((a, b) => b._n.total - a._n.total);
  else if (sortare === "act") r.sort((a, b) => b._n.act - a._n.act);
  else r.sort((a, b) => a.nume.localeCompare(b.nume, "ro"));

  const inp = (x, k, max) => `<input class="n" inputmode="decimal" data-m="${esc(x.matricol)}" data-k="${k}"
     data-max="${max}" value="${x.note?.[k] != null ? String(x.note[k]).replace(".", ",") : ""}" placeholder="—"
     aria-label="${k} pentru ${esc(x.nume)}">`;

  el("cat").innerHTML = `<div class="cat__sul"><table class="cat">
    <thead><tr>
      <th class="cs" data-sort="nume">Student</th>
      ${LECTII.map(l => `<th title="${esc(l.titlu)}">C${l.nr}</th>`).join("")}
      <th class="sep" data-sort="act">Activitate<small>/ ${PCT.seminar}</small></th>
      <th class="sep">Tema 1<small>/ ${nr2(TEMA)}</small></th><th>Tema 2<small>/ ${nr2(TEMA)}</small></th><th>Tema 3<small>/ ${nr2(TEMA)}</small></th>
      <th class="sep">Proiect<small>/ ${PCT.proiect}</small></th>
      <th class="sep" data-sort="total">Total<small>/ ${NOTARE.total}</small></th>
      <th class="sep" title="Observațiile tale">Obs.</th>
    </tr></thead>
    <tbody>${r.map(x => `<tr>
      <td class="cs"><button type="button" data-fisa="${esc(x.matricol)}">${esc(x.nume)}</button>
        ${!x.invitat && !x.are_cont ? `<span class="eticheta">fără cont</span>` : ""}
        <span class="mic">${x.invitat ? "invitat" : esc(x.matricol)}</span></td>
      ${LECTII.map(l => {
        const c = "c" + l.nr;
        if (!predate.has(c)) return `<td><span class="pz pz--np" title="nepredată">·</span></td>`;
        const da = (x.prezente || []).includes(c);
        return `<td><span class="pz ${da ? "pz--da" : "pz--nu"}" title="${da ? "prezent" : "absent"}"></span></td>`;
      }).join("")}
      <td class="sep act">${nr2(x._n.act)}<span class="bara"><i style="width:${Math.round(100 * x._n.act / PCT.seminar)}%"></i></span></td>
      <td class="sep">${inp(x, "tema1", TEMA)}</td><td>${inp(x, "tema2", TEMA)}</td><td>${inp(x, "tema3", TEMA)}</td>
      <td class="sep">${inp(x, "proiect", PCT.proiect)}</td>
      <td class="sep tot" data-tot="${esc(x.matricol)}">${nr2(x._n.total)}</td>
      <td class="sep"><button type="button" class="obs-b ${OBS.has(x.matricol) ? "are" : ""}" data-fisa="${esc(x.matricol)}"
        title="${OBS.has(x.matricol) ? esc(OBS.get(x.matricol).slice(0, 140)) : "Adaugă o observație"}">✎</button></td>
    </tr>`).join("")}</tbody></table></div>`;

  el("cat-leg").innerHTML = `<b>Activitatea</b>: fiecare seminar valorează ${nr2(PCT.seminar / NOTARE.activitate.seminare)} puncte.
    Fiecare întrebare are două încercări punctate, una la oră și una acasă; se ia în considerare doar primul răspuns din fiecare.
    Răspuns corect la oră: punctaj întreg; răspuns corect acasă: jumătate. <b>Notele la teme și proiect</b> se introduc direct în tabel și se salvează la ieșirea din câmp.
    Totalul include ${PCT.oficiu || 0} punct din oficiu. Cerc plin: prezent; contur: absent; punct: lecție nepredată.
    Un clic pe nume deschide fișa studentului.`;

  el("cat").querySelectorAll("[data-sort]").forEach(th => th.onclick = () => { sortare = th.dataset.sort; catalog(); });
  el("cat").querySelectorAll("[data-fisa]").forEach(b => b.onclick = () => location.hash = "student=" + encodeURIComponent(b.dataset.fisa));
  el("cat").querySelectorAll("input.n").forEach(i => {
    i.onkeydown = e => { if (e.key === "Enter") i.blur(); };
    i.onchange = () => salveaza(i);
  });
}

async function salveaza(i){
  const t = i.value.trim().replace(",", ".");
  const v = t === "" ? null : Number(t);
  const max = +i.dataset.max;
  i.classList.remove("salvat", "rau");
  if (v !== null && (!Number.isFinite(v) || v < 0 || v > max + 1e-9)){
    i.classList.add("rau"); i.title = `Între 0 și ${nr2(max)}`; return;
  }
  const r = await sb.rpc("pune_nota", { p_matricol: i.dataset.m, p_cheie: i.dataset.k, p_puncte: v }).catch(e => ({ error: e }));
  if (r.error || r.data?.ok === false){ i.classList.add("rau"); i.title = r.error?.message || r.data?.mesaj || "Nu s-a salvat"; return; }
  const x = CAT_TOT.find(y => y.matricol === i.dataset.m);
  x.note = { ...(x.note || {}) };
  if (v === null) delete x.note[i.dataset.k]; else x.note[i.dataset.k] = v;
  i.classList.add("salvat"); i.title = "Salvat";
  const c = el("cat").querySelector(`[data-tot="${CSS.escape(i.dataset.m)}"]`);
  if (c) c.textContent = nr2(nota(x).total);
}

el("caut").oninput = e => { filtru = e.target.value.trim().toLowerCase(); catalog(); };
el("bt-csv").onclick = () => {
  const cap = ["matricol","nume","grupa", ...LECTII.map(l => "C" + l.nr), "activitate","tema1","tema2","tema3","proiect","oficiu","total"];
  const rows = CAT.map(x => { const n = nota(x); return [x.matricol, x.nume, x.grupa || "",
    ...LECTII.map(l => !predate.has("c" + l.nr) ? "" : (x.prezente || []).includes("c" + l.nr) ? "P" : "A"),
    nr2(n.act), x.note?.tema1 ?? "", x.note?.tema2 ?? "", x.note?.tema3 ?? "", x.note?.proiect ?? "", PCT.oficiu || 0, nr2(n.total)]; });
  const text = "﻿" + [cap, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = `catalog-${(GRUPE.find(g => g.id === grupa)?.nume || "grupa").replace(/\s+/g, "-")}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

/* ======================================================== FIȘA STUDENTULUI === */
function inchideFisa(){ document.querySelectorAll(".fisa,.fisa-fundal").forEach(x => x.remove()); }
function fisa(matricol){
  inchideFisa();
  const x = CAT_TOT.find(y => y.matricol === matricol);
  if (!x) return;
  const n = nota(x), a = act(x);
  const f = document.createElement("div");
  f.innerHTML = `<div class="fisa-fundal"></div><aside class="fisa" role="dialog" aria-label="Fișa studentului ${esc(x.nume)}">
    <button class="icon-btn fisa__x" type="button" aria-label="Închide">✕</button>
    <h2>${esc(x.nume)}</h2>
    <p class="fisa__m">${x.invitat ? "invitat" : esc(x.matricol)}${x.grupa ? " · " + esc(x.grupa) : ""}${x.invitat ? "" : x.are_cont ? " · are cont" : " · încă fără cont"}${
      x.ultima ? " · ultima activitate " + new Date(x.ultima).toLocaleDateString("ro-RO", { day:"numeric", month:"short" }) : ""}</p>
    ${x.invitat ? "" : `<p class="fisa__cont" id="fisa-cont">${x.are_cont ? "Se caută contul GitHub asociat…" : "Încă nu și-a ales numele din listă."}</p>`}
    <div class="fisa__note">
      <div class="fisa__n"><b>${nr2(n.total)}</b><span>din ${NOTARE.total}, până acum</span></div>
      <div class="fisa__n"><b>${nr2(n.act)}</b><span>activitate, din ${PCT.seminar}</span></div>
      <div class="fisa__n"><b>${nr2(n.teme + n.proiect)}</b><span>teme și proiect, din ${PCT.teme + PCT.proiect}</span></div>
    </div>
    <h3>Notele acordate</h3>
    <div class="fisa__in">
      ${[["tema1", "Tema 1", TEMA], ["tema2", "Tema 2", TEMA], ["tema3", "Tema 3", TEMA], ["proiect", "Proiect", PCT.proiect]].map(([k, t, max]) => `
        <label>${t}<small>/ ${nr2(max).replace(",00", "")}</small>
          <input class="n" inputmode="decimal" data-m="${esc(x.matricol)}" data-k="${k}" data-max="${max}"
            value="${x.note?.[k] != null ? String(x.note[k]).replace(".", ",") : ""}" placeholder="—"></label>`).join("")}
    </div>
    <h3>Observațiile tale</h3>
    ${areObs ? `<textarea class="fisa__obs" data-obs="${esc(x.matricol)}" rows="5"
      placeholder="Observații despre activitatea la curs, aspecte de urmărit, dificultăți. Vizibile doar pentru profesor.">${esc(OBS.get(x.matricol) || "")}</textarea>
      <p class="mic fisa__salv" aria-live="polite"></p>`
      : `<p class="gol-s">Rulează <code>db/21-observatii.sql</code> pentru a activa observațiile.</p>`}
    <h3>Pe seminare</h3>
    ${LECTII.map(l => {
      const c = "c" + l.nr, pe = a.pe[l.nr];
      const prez = !predate.has(c) ? "nepredată" : (x.prezente || []).includes(c) ? "prezent" : "absent";
      return `<div class="fisa__l"><span class="mic">C${l.nr}</span>
        <span>${esc(l.titlu)}<br><span class="mic">${prez}${pe ? ` · ${pe.laOra} corecte la oră, ${pe.acasa} acasă, din ${pe.n}${pe.incercari ? ` · ${pe.incercari} încercări în total` : ""}` : ""}</span></span>
        <span class="mic">${pe ? nr2(pe.puncte) : ""}</span></div>`;
    }).join("")}
    <h3>Texte scrise și cod trimis</h3>
    <div id="fisa-scris"><p class="gol-s">Se încarcă…</p></div>
  </aside>`;
  document.body.appendChild(f);
  f.querySelectorAll("input.n").forEach(i => {
    i.onkeydown = e => { if (e.key === "Enter") i.blur(); };
    i.onchange = async () => { await salveaza(i); catalog(); kpi(); };
  });
  const ta = f.querySelector("[data-obs]");
  if (ta){
    const salv = f.querySelector(".fisa__salv");
    ta.onchange = async () => {
      salv.textContent = "Se salvează…";
      const r = await rpc("pune_observatie", { p_matricol: ta.dataset.obs, p_text: ta.value });
      if (r?.ok){ salv.textContent = "Salvat."; if (ta.value.trim()) OBS.set(ta.dataset.obs, ta.value); else OBS.delete(ta.dataset.obs); catalog(); }
      else salv.textContent = "Nu s-a salvat: " + (r?.eroare || r?.mesaj || "");
    };
  }
  /* contul GitHub legat de nume, și dezlegarea unei alegeri greșite */
  const fc = f.querySelector("#fisa-cont");
  if (fc && x.are_cont){
    rpc("contul_studentului", { p_matricol: x.matricol }).then(c => {
      if (!c){ fc.textContent = "Rulează db/22-intrare-sigura.sql pentru a vedea contul asociat."; return; }
      const zi = c.legat_la ? new Date(c.legat_la).toLocaleDateString("ro-RO", { day:"numeric", month:"short" }) : "";
      fc.innerHTML = `Asociat cu ${c.github_login ? `<a class="leg" href="https://github.com/${encodeURIComponent(c.github_login)}" target="_blank" rel="noopener">@${esc(c.github_login)}</a>` : "un cont GitHub"}${zi ? " din " + zi : ""}. ${c.informare_la
          ? `Informarea GDPR confirmată pe ${new Date(c.informare_la).toLocaleDateString("ro-RO", { day:"numeric", month:"short", year:"numeric" })}.`
          : "Informarea GDPR nu este confirmată încă."}
        <button type="button" class="btn btn--mic" id="bt-dezleaga">Asociere greșită? Anulează asocierea</button>`;
      const b = fc.querySelector("#bt-dezleaga");
      b.onclick = async () => {
        if (b.dataset.sigur !== "1"){ b.dataset.sigur = "1"; b.textContent = "Confirmă: apasă din nou"; return; }
        const r = await rpc("dezleaga_student", { p_matricol: x.matricol });
        if (r?.ok){ fc.textContent = "Asocierea a fost anulată. La următoarea oră, studentul își poate alege din nou numele."; x.are_cont = false; catalog(); kpi(); }
        else fc.textContent = "Operația nu a reușit: " + (r?.mesaj || "");
      };
    }).catch(() => { fc.textContent = "Contul asociat nu poate fi citit acum."; });
  }
  const inchide = () => { history.replaceState(null, "", "#catalog"); arata(); };
  f.querySelector(".fisa__x").onclick = inchide;
  f.querySelector(".fisa-fundal").onclick = inchide;
  const laEsc = e => { if (e.key === "Escape"){ removeEventListener("keydown", laEsc); inchide(); } };
  addEventListener("keydown", laEsc);
  Promise.all([
    sb.rpc("sumar_scrise", { p_capitol: null, p_tip: null }).then(r => (r.data || []).filter(y => y.matricol === matricol)).catch(() => []),
    sb.rpc("sumar_cod").then(r => (r.data || []).filter(y => y.matricol === matricol && (y.cod || "").trim())).catch(() => [])
  ]).then(([scris, cod]) => {
    const g = document.getElementById("fisa-scris"); if (!g) return;
    g.innerHTML = (scris.map(s => `<figure class="scr__c"><blockquote>${esc(s.text)}</blockquote>
        <figcaption><span class="mic">${esc(s.capitol || "")} · ${esc(s.tip)}</span></figcaption></figure>`).join(""))
      + (cod.map(c => `<div class="cod__r ${c.trecut ? "bun" : "rau"}"><span class="cod__cine">${esc(c.exercitiu_id)}</span>
          <code class="cod__t">${esc(c.cod || "")}</code><span class="cod__i">${c.incercari}×</span></div>`).join(""))
      || `<p class="gol-s">Nicio înregistrare încă.</p>`;
  });
}

/* =============================================================== LECȚIILE === */
function lectii(){
  el("lectii").innerHTML = `<div class="lec2">${LECTII.map(l => {
    const c = "c" + l.nr, ore = ORE.filter(o => o.capitol === c), s = ore[0];
    const med = l.sarcini && CAT.length
      ? CAT.reduce((t, r) => { const pe = act(r).pe[l.nr]; return t + (pe ? pe.laOra + pe.acasa : 0); }, 0) / CAT.length : null;
    return `<div class="lec2__r ${s ? "" : "nepredata"}">
      <span class="lec2__nr">C${l.nr}</span>
      <div><div class="lec2__t">${esc(l.titlu)}</div>
        <div class="lec2__d">${s ? `predată ${ore.length > 1 ? `de ${ore.length} ori, ultima dată ` : ""}${data(s.deschisa_la)}` : "nepredată încă"}</div></div>
      <span class="lec2__d ascunde">${s ? `<b>${s.prezenti}</b> prezenți` : ""}</span>
      <span class="lec2__d ascunde">${med != null && s ? `<b>${nr2(med).replace(",00", "")}</b> din ${l.sarcini} corecte, în medie` : ""}</span>
      <span style="display:flex;gap:6px">
        <button class="btn btn--mic" type="button" data-det="${l.nr}">Detalii</button>
        <a class="btn btn--mic" href="${RADACINA}/${l.cheie}/">Pagina</a>
      </span>
      <div class="lec2__det" id="det-${l.nr}" hidden></div>
    </div>`;
  }).join("")}</div>`;
  el("lectii").querySelectorAll("[data-det]").forEach(b => b.onclick = () => {
    const g = el("det-" + b.dataset.det);
    g.hidden = !g.hidden; b.textContent = g.hidden ? "Detalii" : "Ascunde";
    if (!g.hidden && !g.dataset.gata) detalii(+b.dataset.det, g);
  });
}

async function detalii(nr, g){
  g.dataset.gata = "1";
  const c = "c" + nr, ore = ORE.filter(o => o.capitol === c);
  const aiGrupei = new Set(CAT.map(r => r.matricol));
  g.innerHTML = `<h3>Orele lecției</h3>
    ${ore.length ? `<ul class="sed">${ore.map(rand).join("")}</ul>` : `<p class="gol-s">Lecția nu a fost predată încă acestei grupe.</p>`}
    <h3>Rezolvări pe studenți</h3><div class="d-sarcini"><p class="gol-s">Se încarcă…</p></div>
    <h3>Texte scrise</h3><div class="d-scrise"><p class="gol-s">Se încarcă…</p></div>`;
  legaOre(g);
  const [sar, scr] = await Promise.all([
    sb.rpc("sumar_sarcini", { p_capitol: c }).then(r => (r.data || []).filter(x => aiGrupei.has(x.matricol))).catch(() => []),
    sb.rpc("sumar_scrise", { p_capitol: c, p_tip: null }).then(r => (r.data || []).filter(x => x.tip !== "autoevaluare" && aiGrupei.has(x.matricol))).catch(() => [])
  ]);
  g.querySelector(".d-sarcini").innerHTML = grila(sar);
  g.querySelector(".d-scrise").innerHTML = scr.length ? `<div class="tabla2">${scr.map(x => `<figure class="scr__c"><blockquote>${esc(x.text)}</blockquote>
      <figcaption>${esc(x.nume)} <span class="mic">${new Date(x.creat_la).toLocaleDateString("ro-RO", { day:"numeric", month:"short" })}</span></figcaption></figure>`).join("")}</div>` : `<p class="gol-s">Niciun text scris la această lecție.</p>`;
}

function grila(d){
  if (!d.length) return `<p class="gol-s">Niciun student din grupă nu a rezolvat încă sarcini la această lecție.</p>`;
  const lista = [...new Set(d.map(x => x.sarcina))].sort();
  const oameni = [...new Map(d.map(x => [x.matricol, x])).values()];
  const k = new Map(d.map(x => [x.matricol + "|" + x.sarcina, x]));
  const scurt = s => String(s).replace(/^c\d+-/, "").replace(/^cod-/, "").slice(0, 14);
  return `<div class="leg"><span class="leg__i"><i class="cel cel--live"></i> la oră</span>
      <span class="leg__i"><i class="cel cel--singur"></i> acasă</span><span class="leg__i"><i class="cel"></i> nerezolvat</span></div>
    <div class="grila__sul"><table class="grila">
    <thead><tr><th class="grila__cine">Student</th>${lista.map(s => `<th class="grila__v"><span>${esc(scurt(s))}</span></th>`).join("")}<th class="grila__t">la oră</th></tr></thead>
    <tbody>${oameni.map(st => `<tr><th class="grila__cine">${esc(st.nume)}</th>${lista.map(s => {
      const x = k.get(st.matricol + "|" + s);
      if (!x) return `<td><i class="cel"></i></td>`;
      const c = x.context === "live" ? "live" : "singur";
      return `<td><i class="cel cel--${c} ${x.reusit ? "" : "cel--ratat"}" title="${esc(s)}"></i></td>`;
    }).join("")}<td class="grila__t">${lista.filter(s => k.get(st.matricol + "|" + s)?.context === "live").length}/${lista.length}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

/* ================================================================== ORELE === */
function ore(){
  const invit = grupa === INV && CAT.length;
  if (!ORE.length && !ARH.length){
    el("ore-corp").innerHTML = `<div class="gol"><p class="gol__t">Nicio oră înregistrată cu această grupă</p>
      <p class="gol__d">Când apeși Predă pe pagina unei lecții, ora apare aici, cu raportul ei.</p></div>`
      + (invit ? stergeInvitatiHTML() : "");
    legaStergeri();
    return;
  }
  el("ore-corp").innerHTML = `
    ${ORE.length ? `<ul class="sed">${ORE.map(rand).join("")}</ul>` : `<p class="gol-s">Toate orele grupei sunt arhivate.</p>`}
    ${ARH.length ? `<details class="arh"><summary>Arhivate (${ARH.length}): excluse din catalog și din statistici; pot fi șterse definitiv</summary>
      <ul class="sed">${ARH.map(rand).join("")}</ul></details>` : ""}
    ${invit ? stergeInvitatiHTML() : ""}`;
  legaOre(el("ore-corp"));
  legaStergeri();
}
const stergeInvitatiHTML = () => `<div class="card" style="margin-top:24px">
  <p class="card__et">întreținere</p><p class="card__t">Șterge toți invitații</p>
  <p class="card__d">Conturile de invitat și toată activitatea lor. Studenții din grupe nu sunt afectați.
  <button class="btn btn--mic btn-sterge" type="button" data-sterge-inv style="margin-left:8px">Șterge invitații</button></p></div>`;

function rand(s){
  const arh = s.zile_ramase != null;
  return `<li>
    <div style="flex:1;min-width:0">
      <p class="sed__t">${esc(s.titlu)}${s.grupa && grupa === INV ? ` <span class="eticheta">${esc(s.grupa)}</span>` : ""}</p>
      <p class="sed__d">${dataLunga(s.deschisa_la)} · ${s.minute} min · ${s.prezenti} prezenți
        ${s.inchisa_la ? "" : " · <strong>în desfășurare</strong>"}${arh ? ` · se șterge automat în ${s.zile_ramase} zile` : ""}</p>
    </div>
    <div class="sed__a">
      <button class="btn btn--mic" type="button" data-rap="${s.id}">Raportul</button>
      <button class="btn btn--mic" type="button" data-arh="${s.id}" data-inapoi="${arh ? 1 : 0}">${arh ? "Restaurează" : "Arhivează"}</button>
      ${arh ? `<button class="btn btn--mic btn-sterge" type="button" data-sterge="${s.id}">Șterge definitiv</button>` : ""}
    </div>
    <div class="sed__rap" data-rap-g="${s.id}" hidden></div>
  </li>`;
}

function legaOre(g){
  g.querySelectorAll("[data-arh]").forEach(b => b.onclick = async () => {
    await O.arhiveaza(b.dataset.arh, b.dataset.inapoi === "1"); location.reload();
  });
  g.querySelectorAll("[data-rap]").forEach(b => b.onclick = () => {
    const r = g.querySelector(`[data-rap-g="${CSS.escape(b.dataset.rap)}"]`);
    r.hidden = !r.hidden; b.textContent = r.hidden ? "Raportul" : "Închide raportul";
    if (!r.hidden && !r.dataset.gata) raport(b.dataset.rap, r);
  });
}

/* Ștergerea de tot cere o confirmare scrisă în pagină, nu un dialog al
   browserului: un clic greșit nu șterge nimic. */
function legaStergeri(){
  document.querySelectorAll("[data-sterge]").forEach(b => b.onclick = async () => {
    if (b.dataset.sigur !== "1"){ b.dataset.sigur = "1"; b.textContent = "Confirmă: încă un clic"; return; }
    b.disabled = true;
    const r = await rpc("sterge_sedinta", { p_id: b.dataset.sterge });
    if (r?.ok) location.reload(); else { b.textContent = "Operația nu a reușit"; b.title = r?.eroare || r?.mesaj || ""; }
  });
  document.querySelectorAll("[data-sterge-inv]").forEach(b => b.onclick = async () => {
    if (b.dataset.sigur !== "1"){ b.dataset.sigur = "1"; b.textContent = "Confirmă: încă un clic"; return; }
    b.disabled = true;
    const r = await rpc("sterge_invitati");
    if (r?.ok) location.reload(); else { b.textContent = "Operația nu a reușit"; b.title = r?.eroare || r?.mesaj || ""; }
  });
}

async function raport(id, g){
  g.innerHTML = `<div class="sch sch--r"></div>`;
  const [r, randuri] = await Promise.all([O.raport(id), O.sumar(id)]);
  if (!r?.ok){ g.innerHTML = `<p class="gol-s">Raportul nu poate fi citit.</p>`; return; }
  g.dataset.gata = "1";
  const l = lectiaDe(r.capitol);
  /* ce au scris în ora asta: textele lecției, din fereastra orei, ale celor din oră */
  const inOra = new Set((randuri || []).map(x => x.matricol));
  const pana = r.inchisa_la ? new Date(r.inchisa_la) : new Date();
  const texte = await sb.rpc("sumar_scrise", { p_capitol: r.capitol, p_tip: null })
    .then(x => (x.data || []).filter(t => inOra.has(t.matricol) && new Date(t.creat_la) >= new Date(r.deschisa_la) && new Date(t.creat_la) <= pana))
    .catch(() => []);
  g.innerHTML = `
    <div class="cif">
      <div class="cif__c"><p class="cif__n">${r.prezenti}<small>/${r.inscrisi || "—"}</small></p><p class="cif__e">prezenți, din înscriși</p></div>
      <div class="cif__c"><p class="cif__n">${r.sarcini_atinse}<small>/${l?.sarcini ?? "—"}</small></p><p class="cif__e">sarcini abordate</p></div>
      <div class="cif__c"><p class="cif__n">${r.texte}</p><p class="cif__e">texte scrise de studenți</p></div>
    </div>
    ${r.impotmolire ? `<div class="card" style="margin-bottom:16px"><p class="card__et">sarcina cu cea mai mică rată de reușită</p>
      <p class="card__t">${esc(r.impotmolire.sarcina)}</p><p class="card__d">Doar ${r.impotmolire.trecuti} din ${r.impotmolire.din} au rezolvat-o corect.</p></div>` : ""}
    ${randuri?.length ? `<table class="tb"><thead><tr><th>Student</th><th>Prezent</th><th>Trimise</th><th>Corecte</th><th style="text-align:right">Ora intrării</th></tr></thead>
      <tbody>${randuri.map(x => `<tr><td>${esc(x.nume)}</td>
        <td><button class="btn btn--mic" type="button" data-prez="${esc(x.matricol)}" data-val="${x.prezent ? 0 : 1}">
          <span class="g ${x.prezent ? "g--ok" : "g--nim"}">${x.prezent ? "✓" : "○"}</span> ${x.prezent ? "prezent" : "absent"}</button></td>
        <td class="rap">${x.trimise}</td><td class="rap">${x.trecute}</td>
        <td style="text-align:right" class="rap">${x.prima ? ora(x.prima) : "—"}</td></tr>`).join("")}</tbody></table>
      <p class="rap" style="margin:10px 0 0">Prezent: a lucrat în timpul orei. Starea se modifică printr-un clic.</p>`
      : `<p class="gol-s">Nicio activitate înregistrată în această oră.</p>`}
    ${texte.length ? `<h3 class="lec2__h">Texte scrise în această oră</h3><div class="tabla2">${texte.map(t =>
      `<figure class="scr__c"><blockquote>${esc(t.text)}</blockquote><figcaption>${esc(t.nume)}</figcaption></figure>`).join("")}</div>` : ""}`;
  g.querySelectorAll("[data-prez]").forEach(b => b.onclick = async () => {
    await O.punePrezenta(id, b.dataset.prez, b.dataset.val === "1"); g.dataset.gata = ""; raport(id, g);
  });
}

function data(t){ const x = new Date(t); return `${x.getDate()} ${LUNI[x.getMonth()].slice(0, 3)}`; }
function dataLunga(t){ const x = new Date(t); return `${ZILE[x.getDay()]}, ${x.getDate()} ${LUNI[x.getMonth()]}, ${ora(t)}`; }
function ora(t){ const x = new Date(t); return `${String(x.getHours()).padStart(2, "0")}:${String(x.getMinutes()).padStart(2, "0")}`; }

/* ============================================================== ECHIPELE === */
/* db/23: alegerea echipelor pe grupă, cererile celor întârziați, mutări. */
let opresteEchipe = null;
async function echipe(){
  const g = el("echipe-corp");
  if (opresteEchipe){ opresteEchipe(); opresteEchipe = null; }
  if (grupa === INV || !grupa){ g.innerHTML = `<p class="gol-s">Echipele se formează pe grupe de studenți, nu pentru invitați.</p>`; return; }
  try {
    const E = await import("../js/echipe.js?v=87");
    g.innerHTML = "";
    opresteEchipe = await E.echipeProfesor(g, { grupa, numeGrupa: GRUPE.find(x => x.id === grupa)?.nume || "" });
  } catch (e) { g.textContent = "Echipele nu au putut fi încărcate: " + e.message; }
}

function totul(){ filtreaza(); deseneazaGrupe(); kpi(); catalog(); lectii(); ore(); if (!document.querySelector('.vedere[data-v="echipe"]').hidden) echipe(); }
totul();

/* venit de la „Raportul orei”, la încheierea unei ore: fila Orele, cu raportul deschis */
const cerut = new URLSearchParams(location.search).get("raport");
if (cerut){
  const s = [...ORE_TOT, ...ARH_TOT].find(x => x.id === cerut);
  if (s && "grupa_id" in s && s.grupa_id !== grupa && GRUPE.some(g => g.id === s.grupa_id)){ grupa = s.grupa_id; totul(); }
  history.replaceState(null, "", "#ore");
  const b = el("ore-corp").querySelector(`[data-rap="${CSS.escape(cerut)}"]`);
  if (b){ b.click(); setTimeout(() => b.closest("li").scrollIntoView({ block: "start", behavior: "smooth" }), 80); }
}
arata();
</script>
