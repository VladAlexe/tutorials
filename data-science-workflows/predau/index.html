<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predau · Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sistem.css?v=42">
<link rel="stylesheet" href="../css/predau.css?v=42">
<script src="../js/tema.js?v=42"></script>
</head>
<body>

<div id="antet" data-aici="Predau" data-predau></div>

<main class="pd">
  <div id="banda"></div>

  <div class="pd__cap">
    <div>
      <p class="pd__et" id="ziua">—</p>
      <h1 class="pd__t" id="titlu">Lecțiile</h1>
      <p class="pd__d" id="sub">Se încarcă…</p>
    </div>
  </div>

  <div id="corp"><div class="sch sch--r"></div><div class="sch sch--r"></div></div>

  <h2 class="pd__t" style="font-size:19px;margin:34px 0 4px">Ultimele ședințe</h2>
  <p class="pd__d" style="margin:0 0 14px">Istoricul cursului. De aici se deschide
  raportul fiecărei ore.</p>
  <div id="istoric"><div class="sch sch--r"></div></div>
</main>

<script type="module" src="../js/antet.js?v=42"></script>
<script type="module">
/* ===========================================================================
   PAGINA ASTA NU PORNEȘTE ORA.

   Până acum o porneai din două locuri: de aici, cu o propoziție în care alegeai
   lecția, grupa și modul, și din bara de jos a lecției, cu un buton. Două
   porniri, două coduri, și un profesor care nu știa pe care să se uite. Acum
   ora pornește într-un singur loc: în lecție, de la butonul din bandă — adică
   exact acolo unde stai când intri la clasă.

   Aici e doar lista: ce am predat, ce urmează, și intrarea în fiecare lecție.
   =========================================================================== */

import { RADACINA, LECTII } from "../js/curs.js?v=42";
import * as O from "../js/ora.js?v=42";

const el = id => document.getElementById(id);
const ZILE = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const LUNI = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie",
              "august","septembrie","octombrie","noiembrie","decembrie"];

let A;
try { A = await import("../js/auth.js?v=42"); }
catch { el("sub").textContent = "Nu pot încărca autentificarea."; throw 0; }

const p = await A.profil();
if (!p.autentificat){ location.replace(`${RADACINA}/intra/?spre=${encodeURIComponent(location.pathname)}`); throw 0; }
if (!p.profesorReal){ location.replace(`${RADACINA}/cont/`); throw 0; }

const d = new Date();
el("ziua").textContent = `Predau · ${ZILE[d.getDay()]}, ${d.getDate()} ${LUNI[d.getMonth()]}`;

const [viu, raw] = await Promise.all([O.deschisa(), O.lista(false)]);
/* Dacă baza n-are încă funcția, O.lista() întoarce null. Listă goală, nu
   pagină ruptă: pagina spune „încă nicio ședință", care e adevărul. */
const sedinte = Array.isArray(raw) ? raw : [];

banda(viu);
lista(viu, sedinte);
istoric(sedinte);

/* --- banda de stare ------------------------------------------------------ */

function banda(s){
  el("banda").innerHTML = s
    ? `<div class="st st--viu">
         <span class="st__pct"></span>
         <span class="st__t">Ora e deschisă</span>
         <span class="st__d">${s.titlu} · codul <strong>${s.cod || "—"}</strong>
           · de ${s.minute} min · ${s.in_clasa} au lucrat</span>
         <span class="st__sp"></span>
         <a class="btn btn--tare" href="ora/">Panoul live</a>
       </div>`
    : `<div class="st">
         <span class="st__pct"></span>
         <span class="st__t">Nicio oră deschisă</span>
         <span class="st__d">deschide lecția și pornești ora din bara de jos</span>
       </div>`;
}

/* --- lista lecțiilor ------------------------------------------------------
   Un rând per lecție, în ordine. Rândul spune ce s-a ținut și când, și are un
   singur buton: intri în lecție. Lecția care urmează e scoasă în față. */

function lista(viu, sedinte){
  const gata = LECTII.filter(l => l.sarcini);
  const cand = new Map();
  for (const s of sedinte) if (!cand.has(s.capitol)) cand.set(s.capitol, s);

  const urmatoarea = viu
    ? gata.find(l => "c" + l.nr === viu.capitol)
    : gata.find(l => !cand.has("c" + l.nr)) || gata[gata.length - 1];

  el("titlu").textContent = viu ? viu.titlu : "Lecțiile";
  el("sub").textContent = viu
    ? "Ești în oră. Panoul live îți arată, pe slide-ul de pe ecran, cât din sală a răspuns și cine anume."
    : "Deschide lecția și pornești ora dintr-un buton, din bara de jos. Codul apare mare, de proiectat.";

  el("corp").innerHTML = `<ul class="lec">${gata.map(l => {
    const s = cand.get("c" + l.nr);
    const acum = urmatoarea && l.nr === urmatoarea.nr;
    return `<li class="${acum ? "lec--acum" : ""}">
      <span class="lec__nr">${l.nr}</span>
      <div class="lec__c">
        <p class="lec__t">${l.titlu}</p>
        <p class="lec__d">${l.sarcini} sarcini · ${
          viu && "c" + l.nr === viu.capitol
            ? `<strong>se predă acum</strong>, codul ${viu.cod || "—"}`
            : s ? `ținută ${data(s.deschisa_la)}, ${s.prezenti} prezenți`
                : acum ? "urmează" : "neținută"}</p>
      </div>
      <a class="btn ${acum ? "btn--tare" : "btn--mic"}"
         href="${RADACINA}/${l.cheie}/lectie/">${acum && !viu ? "Predă" : "Deschide"}</a>
    </li>`;
  }).join("")}</ul>`;
}

/* --- istoricul ----------------------------------------------------------- */

function istoric(list){
  if (!list.length){
    el("istoric").innerHTML = `
      <div class="gol">
        <p class="gol__t">Încă nicio ședință</p>
        <p class="gol__d">Când pornești prima oră, apare aici, cu raportul ei.</p>
      </div>`;
    return;
  }
  el("istoric").innerHTML = `<ul class="sed">${list.slice(0,6).map(s => `
    <li>
      <div>
        <p class="sed__t">${s.titlu}</p>
        <p class="sed__d">${data(s.deschisa_la)} · ${s.minute} min ·
          ${s.prezenti} prezenți${s.inchisa_la ? "" : " · <strong>deschisă</strong>"}</p>
      </div>
      <div class="sed__a">
        <a class="btn btn--mic" href="sedinte/?id=${s.id}">Raportul</a>
      </div>
    </li>`).join("")}</ul>
    <p style="margin:14px 0 0"><a class="leg" href="sedinte/">Toate ședințele</a></p>`;
}

function data(t){
  const x = new Date(t);
  return `${x.getDate()} ${LUNI[x.getMonth()].slice(0,3)}, ${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`;
}
</script>

<style>
/* Lista lecțiilor. Un rând e un rând: număr, titlu, o linie de stare, un
   buton. Lecția care urmează are fundalul puțin mai cald și butonul plin —
   nu altă formă, nu alt chenar, doar mai multă greutate. */
.lec{list-style:none;margin:0;padding:0;max-width:none;
  display:flex;flex-direction:column;gap:7px}
.lec li{display:flex;align-items:center;gap:15px;margin:0;padding:13px 16px;
  background:var(--panza);border:1px solid var(--linie);border-radius:11px}
.lec li::before{content:none}
.lec--acum{background:var(--panza-2);border-color:var(--linie-2)}
.lec__nr{font-family:var(--mono);font-size:13px;color:var(--text-3);
  width:22px;flex:none;text-align:center}
.lec--acum .lec__nr{color:var(--accent-text);font-weight:500}
.lec__c{flex:1;min-width:0}
.lec__t{font-family:var(--sans);font-size:15.5px;font-weight:500;
  color:var(--text);margin:0 0 2px;letter-spacing:-.008em}
.lec__d{font-family:var(--sans);font-size:12.5px;color:var(--text-2);margin:0}
@media (max-width:560px){
  .lec li{flex-wrap:wrap}
  .lec__c{flex-basis:calc(100% - 37px)}
  .lec li .btn{margin-left:37px}
}
</style>
</body>
</html>
