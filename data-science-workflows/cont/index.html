<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contul meu · Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../css/fonturi.css?v=100">
<link rel="stylesheet" href="../css/sistem.css?v=100">
<link rel="stylesheet" href="../css/cont.css?v=100">
<script src="../js/tema.js?v=100"></script>
</head>
<body>

<div id="antet" data-aici="Contul meu"></div>

<main>
<div class="pagina">
  <div id="pagina"><p class="incarca">Se încarcă…</p></div>
</div>
</main>

<div id="subsol"></div>

<script type="module">
import { LECTII, NOTARE, RADACINA, activitate, rezolvariDin } from "../js/curs.js?v=100";

const el = id => document.getElementById(id);
const gazda = el("pagina");
const cand = s => new Date(s).toLocaleString("ro-RO",
  { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");

let A, CFG, N, p;
try {
  A = await import("../js/auth.js?v=100");
  CFG = await import("../js/supabase-config.js?v=100");
  N = await import("../js/alege-nume.js?v=100");
} catch (e) {
  gazda.innerHTML = `<div class="nota"><div class="nota__et">Eroare</div>
    <p>Autentificarea nu a putut fi încărcată: ${esc(e.message)}</p></div>`;
  throw e;
}

const msg = (text, fel) => {
  const m = el("mesaj");
  if (!m) return;
  m.textContent = text; m.className = "mesaj vazut " + (fel || "");
};

/* Pagina asta are patru stări, în ordinea în care le întâlnește cineva:
   nimeni conectat, conectat fără matricol, profesor (care are panoul lui),
   și contul gata, cu progres cu tot. */
async function unde(){
  p = await A.profil({ proaspat:true });

  /* dacă am plecat spre GitHub de pe pagina de prezență, ne întoarcem acolo:
     altfel jetonul din codul QR s-ar pierde la întoarcere */
  if (p.autentificat){
    const inapoi = adresaDeIntoarcere();
    if (inapoi){ location.replace(inapoi); return; }
  }

  if (!p.autentificat) return intrare();
  /* Un cont de profesor nu intră în contul de student, punct. Nici dacă are
     pornit modul „vezi ca student": ăla e pentru paginile de lecție, ca să
     poți verifica ce văd ei, nu ca să ai două conturi deodată.

     Dacă chiar vrei să vezi pagina asta așa cum o vede un student, o deschizi
     cu ?ca=student. E o ușă de probă, nu o stare în care rămâi. */
  const proba = new URLSearchParams(location.search).get("ca") === "student";
  if (p.profesorReal && !proba){
    location.replace(RADACINA + "/predau/"); return;
  }
  /* prima intrare cu GitHub: întâi numele din listă, apoi contul */
  if (N.trebuieAles(p) && !sarit) return alegere();
  return deseneaza();
}

/* Adresa paginii de intrare la oră, dacă de acolo s-a plecat spre GitHub.
   sessionStorage ține de filă; unele telefoane revin de la GitHub într-o filă
   nouă, de aceea și localStorage, valabil o jumătate de oră. Doar o adresă
   de pe pagina de intrare, nu orice adresă găsită acolo. */
function adresaDeIntoarcere(){
  let u = null;
  try { u = sessionStorage.getItem("dsw.intra"); sessionStorage.removeItem("dsw.intra"); } catch {}
  try {
    const l = JSON.parse(localStorage.getItem("dsw.intra") || "null");
    localStorage.removeItem("dsw.intra");
    if (!u && l && Date.now() - l.t < 30 * 60 * 1000) u = l.u;
  } catch {}
  return u && u.startsWith(location.origin + RADACINA + "/intra/") ? u : null;
}

/* ---------------------------------------------- 1b. alegerea numelui -- */

let inAlegere = false, sarit = false;

function alegere(){
  inAlegere = true;
  gazda.innerHTML = `
    <div class="lg">
      <h1 id="al-t"></h1>
      <p class="lg__d" id="al-d"></p>
      <div id="al-pas"></div>
      <p class="mesaj" id="mesaj"></p>
      <p class="mic" style="text-align:center">Alt cont GitHub? <a class="leg" href="#" id="al-iesi">Ieși din cont</a></p>
    </div>`;
  el("al-iesi").onclick = async e => {
    e.preventDefault(); await A.iesi(); inAlegere = false; unde();
  };
  N.alegeNumele({
    gazda: el("al-pas"),
    cap: (t, d) => { el("al-t").textContent = t; el("al-d").textContent = d; },
    mesaj: msg,
    dupa: () => { inAlegere = false; unde(); },
    faraNume: () => { inAlegere = false; sarit = true; unde(); }
  });
}

/* --------------------------------------------------------- 1. intrarea -- */

function intrare(){
  const er = A.intoarcere?.eroare;
  gazda.innerHTML = `
    <div class="lg">
      <h1>Intră în cont</h1>
      <p class="lg__d">Contul permite salvarea răspunsurilor, urmărirea progresului
      și înregistrarea prezenței.</p>

      <div class="cutie">
        <button class="btn btn--tare" id="bt-github" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 20v-3.2M7 16.8c-2.6 0-3.4-1.7-3.4-3.4 0-1 .3-1.8.9-2.4-.3-.8-.3-2 .1-2.8 1 .1 2 .6 2.7 1.2.8-.2 1.7-.3 2.6-.3s1.8.1 2.6.3c.7-.6 1.7-1.1 2.7-1.2.4.8.4 2 .1 2.8.6.6.9 1.4.9 2.4 0 1.7-.8 3.4-3.4 3.4"/></svg>
          Intră cu GitHub</button>
        <p class="mic">Varianta destinată studenților înscriși la curs. Contul GitHub
        este oricum necesar de la cursul 3, iar activitatea din depozit se asociază
        automat contului tău.</p>



        <div class="ori">sau</div>
        <label for="nume">Numele tău, pentru intrare ca invitat</label>
        <input id="nume" type="text" autocomplete="name" maxlength="60" placeholder="Nume și prenume">
        <button class="btn" id="bt-invitat" type="button">Intră ca invitat</button>
        <p class="mic">Fără cont și fără parolă, pentru vizitatori. Progresul se salvează,
        dar nu se asociază cu numele din lista grupei și nu poate fi transformat ulterior
        într-un cont de student.</p>

        <p class="mesaj" id="mesaj"></p>
      </div>

      <p class="mic" style="text-align:center">Datele înregistrate sunt descrise în
      <a class="leg" href="${RADACINA}/date-personale/">politica de confidențialitate (GDPR)</a>.</p>
    </div>`;

  if (er) msg(er === "access_denied"
    ? "Autentificarea cu GitHub a fost anulată. Încearcă din nou."
    : "GitHub a returnat o eroare: " + er, "rau");

  el("bt-github").onclick = async e => {
    e.target.disabled = true;
    try { await A.intraCuGithub(); }
    catch (x) { e.target.disabled = false; msg(x.message, "rau"); }
  };
  el("bt-invitat").onclick = async e => {
    const nume = el("nume").value.trim();
    if (nume.length < 2){ msg("Introdu un nume, pentru identificarea în listă.", "rau"); return; }
    e.target.disabled = true;
    try {
      const r = await A.intraCaInvitat(nume);
      if (!r?.ok) throw new Error(r?.mesaj || "Intrarea nu a reușit.");
      unde();
    } catch (x) { e.target.disabled = false; msg(x.message, "rau"); }
  };
}

/* ====================================================================== */

async function deseneaza(){
  const invitat = A.esteInvitat(p);

  /* Tot ce trebuie pentru notă: răspunsurile tale și codul tău (le citești
     doar pe ale tale), orele arhivate (de test, nu se pun), notele puse de
     profesor. */
  let randuri = [], noteMele = {}, prezente = [];
  try {
    const [r, c, arh, z] = await Promise.all([
      A.sb.from("raspunsuri").select("intrebare_id, raspuns, corect, creat_la, sedinta_id"),
      A.sb.from("rulari_cod").select("exercitiu_id, cod, trecut, creat_la, sedinta_id"),
      A.sb.from("sedinte").select("id").not("arhivata_la", "is", null),
      A.sb.from("prezente").select("curs, sedinta_id")
    ]);
    const arhivate = new Set((arh.data || []).map(x => x.id));
    const buna = x => !x.sedinta_id || !arhivate.has(x.sedinta_id);
    randuri = [
      ...(r.data || []).filter(buna).map(x => ({ sarcina: x.intrebare_id, laOra: !!x.sedinta_id,
          corect: !!x.corect, gol: x.raspuns == null, cand: x.creat_la })),
      ...(c.data || []).filter(buna).map(x => ({ sarcina: x.exercitiu_id, laOra: !!x.sedinta_id,
          corect: !!x.trecut, gol: !String(x.cod || "").trim(), cand: x.creat_la }))
    ];
    prezente = [...new Set((z.data || []).filter(x => !x.sedinta_id || !arhivate.has(x.sedinta_id)).map(x => x.curs))];
    noteMele = await A.sb.rpc("note_mele").then(x => x.data || {}).catch(() => ({}));
  } catch { /* fără rețea, nota rămâne goală */ }

  const a = activitate(rezolvariDin(randuri));
  const PCT = Object.fromEntries(NOTARE.componente.map(c => [c.cheie, c.puncte]));
  const teme = ["tema1","tema2","tema3"].map(k => noteMele[k] != null ? +noteMele[k] : null);
  const pTeme = teme.reduce((s, v) => s + (v || 0), 0);
  const pProiect = noteMele.proiect != null ? +noteMele.proiect : null;
  const total = a.total + pTeme + (pProiect || 0) + PCT.oficiu;
  const nr2 = v => (Math.round(v * 100) / 100).toFixed(2).replace(".", ",");

  /* lecțiile pe care le vezi: cele predate grupei, plus cele în care ai lucrat */
  let lectii = LECTII;
  try {
    const Ora = await import("../js/ora.js?v=100");
    const pred = await Ora.predate();
    if (pred) lectii = LECTII.filter(l => pred.has("c" + l.nr) || a.pe[l.nr]?.incercari);
  } catch {}

  const ini = (p.nume || "?").trim().split(/\s+/).slice(0,2).map(x => x[0] || "").join("").toUpperCase();
  const rand = (nume, val, max, d) => `<div class="nr">
    <span class="nr__n">${nume}</span><span class="nr__d">${d}</span>
    <span class="nr__v">${val == null ? "—" : nr2(val)}<small> / ${nr2(max).replace(",00", "")}</small></span></div>`;

  gazda.innerHTML = `
  <header class="cnt__cap">
    <div class="cnt__cerc"><i>${ini}</i></div>
    <div class="cnt__cine">
      <h1>${esc(p.nume) || "Contul meu"}</h1>
      <p class="cnt__meta">
        ${p.grupa ? `<span class="et">${esc(p.grupa)}</span>` : ""}
        ${invitat ? `<span class="et">invitat</span>` : ""}
      </p>
    </div>
    <div class="cnt__act"><button class="btn btn--mic" id="bt-iesi" type="button">Ieși din cont</button></div>
  </header>
  <div id="echipa-cta"></div>

  ${invitat ? `<div class="nota" style="margin-bottom:26px"><div class="nota__et">Cont de invitat</div>
    <p>Activitatea se salvează, dar nu intră în catalog. Studenții înscriși la curs trebuie să iasă din cont și să intre cu GitHub.</p></div>`
  : !p.matricol ? `<div class="nota" style="margin-bottom:26px"><div class="nota__et">Contul nu este asociat unui nume din listă</div>
    <p>Până îți alegi numele, răspunsurile nu se salvează. Dacă numele tău nu apare în listă, spune-i profesorului.</p>
    <p><button class="btn btn--tare btn--mic" id="bt-alege" type="button">Caută-mi numele</button></p></div>` : ""}

  ${!invitat && p.matricol ? `<section class="cnt__s" id="echipa" hidden>
    <h2>Echipa de proiect</h2>
    <p class="cnt__d">Toate echipele grupei, pe o pagină separată: <a class="leg" href="${RADACINA}/echipe/">Echipele de proiect</a>.</p>
    <div id="echipa-gazda"><p class="incarca">Se încarcă…</p></div>
  </section>` : ""}

  <section class="cnt__s">
    <h2>Punctajul acumulat</h2>
    <div class="tot"><b>${nr2(total)}</b><span>din ${NOTARE.total}</span>
      <i class="tot__b"><i style="width:${Math.min(100, total / NOTARE.total * 100)}%"></i></i></div>
    <div class="note">
      ${rand("Activitate la seminar", a.total, PCT.seminar, "calculată automat din întrebările din lecții (detalii mai jos)")}
      ${rand("Teme", teme.some(v => v != null) ? pTeme : null, PCT.teme,
        `trei teme, pe Teams, notate de profesor: ${teme.map((v, i) => `tema ${i + 1}: ${v == null ? "—" : nr2(v)}`).join(" · ")}`)}
      ${rand("Proiect", pProiect, PCT.proiect, pProiect == null ? "se notează la prezentarea finală" : "notat")}
      ${rand("Din oficiu", PCT.oficiu, PCT.oficiu, "acordat de la început")}
    </div>
  </section>

  <section class="cnt__s">
    <h2>Cum se calculează activitatea</h2>
    <ul class="reguli">
      <li>Fiecare dintre cele ${NOTARE.activitate.seminare} seminare are aceeași pondere: <b>${nr2(a.valoareSeminar)}</b> puncte.</li>
      <li>Fiecare întrebare are <b>două încercări punctate</b>: una la oră și una acasă. Se ia în considerare doar <b>primul răspuns</b> din fiecare.</li>
      <li>Un răspuns corect la oră primește punctajul <b>întreg</b>, unul corect acasă primește <b>jumătate</b>. Se reține rezultatul mai bun.</li>
      <li>Exercițiile cu cod (completare, ordonare, anticiparea rezultatului afișat) se punctează la rezolvare, inclusiv când au fost folosite indiciile.</li>
      <li>Întrebările pot fi refăcute oricând, pentru exercițiu; punctajul nu se mai modifică.</li>
    </ul>
    <table class="tabel tabel--sem">
      <thead><tr><th>Seminar</th><th>Corecte la oră</th><th>Corecte acasă</th><th style="text-align:right">Puncte</th></tr></thead>
      <tbody>${LECTII.filter(l => l.sarcini).map(l => { const x = a.pe[l.nr]; return `<tr>
        <td>C${l.nr}. ${esc(l.titlu)}${prezente.includes("c" + l.nr) ? ` <span class="et">prezent</span>` : ""}</td>
        <td class="mono">${x.laOra} / ${x.n}</td><td class="mono">${x.acasa} / ${x.n}</td>
        <td class="mono" style="text-align:right">${nr2(x.puncte)}</td></tr>`; }).join("")}</tbody>
    </table>
  </section>

  <section class="cnt__s">
    <h2>Lecțiile</h2>
    <div class="lect">${lectii.map(l => { const x = a.pe[l.nr]; return `
      <a class="lect__r" href="${RADACINA}/${l.cheie}/">
        <span class="lect__n">${String(l.nr).padStart(2, "0")}</span>
        <span class="lect__m"><span class="lect__t">${l.titlu}</span>
          <span class="lect__s">${x ? `${x.laOra + x.acasa} din ${x.n} întrebări corecte` : "fără întrebări"}</span></span>
        <span class="lect__p">→</span></a>`; }).join("")}</div>
  </section>`;

  el("bt-iesi").onclick = async () => { await A.iesi(); location.href = RADACINA + "/"; };
  if (el("bt-alege")) el("bt-alege").onclick = () => { sarit = false; alegere(); };

  /* echipa: alegerea, cererile și colegii (db/23); fără tabel, un mesaj */
  if (el("echipa-gazda")){
    try {
      const E = await import("../js/echipe.js?v=100");
      /* fără echipă: îndemnul stă sus, primul lucru din pagină, pentru cine nu a
         fost la ora în care s-au ales echipele */
      /* secțiunea apare doar după ce profesorul a pornit alegerea echipelor */
      const d = await E.amEchipa();
      if (!d || !d.stare || d.stare === "nepornita") return;
      el("echipa").hidden = false;
      if (!d.are && el("echipa-cta")){
        el("echipa-cta").innerHTML = `<div class="nota nota--ech" style="margin-bottom:26px"><div class="nota__et">Echipa de proiect</div>
          <p>Nu faci încă parte dintr-o echipă. ${d.stare === "deschisa"
            ? "Alegerea este deschisă: intră într-o echipă cu locuri libere."
            : "Alegerea liberă s-a încheiat: trimite o cerere unei echipe cu locuri libere."}</p>
          <p><a class="btn btn--tare btn--mic" href="#echipa">Alege echipa</a>
          <a class="leg" href="${RADACINA}/echipe/" style="margin-left:14px">Echipele de proiect</a></p></div>`;
      }
      await E.echipeStudent(el("echipa-gazda"));
      if (location.hash === "#echipa") el("echipa").scrollIntoView();
    } catch (e) { el("echipa-gazda").textContent = "Echipele nu au putut fi încărcate."; }
  }
}

try { await unde(); }
catch (e) {
  /* o eroare nu lasă pe nimeni prins: se poate reîncerca sau ieși din cont */
  gazda.innerHTML = `<div class="lg"><h1>Contul nu a putut fi încărcat</h1>
    <p class="lg__d">${esc(e.message || "Rețeaua nu răspunde.")}</p>
    <div class="cutie"><button class="btn btn--tare" type="button" id="din-nou">Încearcă din nou</button>
    <button class="btn" type="button" id="iesi-eroare">Ieși din cont</button></div></div>`;
  el("din-nou").onclick = () => location.reload();
  el("iesi-eroare").onclick = async () => {
    try { await A.iesi(); } catch { try { await A.sb.auth.signOut({ scope: "local" }); } catch {} }
    location.reload();
  };
}
/* în timpul alegerii numelui nu redesenez: o reînnoire a jetonului ar șterge
   ce a scris studentul în căutare */
A.laSchimbare(() => { if (!inAlegere) unde().catch(() => {}); });
</script>
<script type="module" src="../js/antet.js?v=100"></script>
<script type="module" src="../js/subsol.js?v=100"></script>
</body>
</html>
