<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contul meu — Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sistem.css?v=44">
<link rel="stylesheet" href="../css/cont.css?v=44">
<script src="../js/tema.js?v=44"></script>
</head>
<body>

<div id="antet" data-aici="Contul meu"></div>

<main>
<div class="pagina">
  <div id="pagina"><p class="incarca">Se încarcă…</p></div>
</div>
</main>

<div id="subsol"></div>

<script type="module">
import { LECTII, NOTARE, RADACINA } from "../js/curs.js?v=44";

const el = id => document.getElementById(id);
const gazda = el("pagina");
const cand = s => new Date(s).toLocaleString("ro-RO",
  { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");

let A, CFG, p;
try {
  A = await import("../js/auth.js?v=44");
  CFG = await import("../js/supabase-config.js?v=44");
} catch (e) {
  gazda.innerHTML = `<div class="nota"><div class="nota__et">Nu merge</div>
    <p>Nu pot încărca autentificarea: ${esc(e.message)}</p></div>`;
  throw e;
}

const msg = (text, fel) => {
  const m = el("mesaj");
  if (!m) return;
  m.textContent = text; m.className = "mesaj vazut " + (fel || "");
};

/* Pagina asta are patru stări, în ordinea în care le întâlnește cineva:
   nimeni conectat, conectat fără matricol, profesor (care are panoul lui),
   și contul gata, cu progres cu tot. */
async function unde(){
  p = await A.profil({ proaspat:true });

  /* dacă am plecat spre GitHub de pe pagina de prezență, ne întoarcem acolo:
     altfel jetonul din codul QR s-ar pierde la întoarcere */
  if (p.autentificat){
    let inapoi = null;
    try { inapoi = sessionStorage.getItem("dsw.intra"); sessionStorage.removeItem("dsw.intra"); }
    catch {}
    if (inapoi){ location.replace(inapoi); return; }
  }

  if (!p.autentificat) return intrare();
  /* Un cont de profesor nu intră în contul de student, punct. Nici dacă are
     pornit modul „vezi ca student": ăla e pentru paginile de lecție, ca să
     poți verifica ce văd ei, nu ca să ai două conturi deodată.

     Dacă chiar vrei să vezi pagina asta așa cum o vede un student, o deschizi
     cu ?ca=student. E o ușă de probă, nu o stare în care rămâi. */
  const proba = new URLSearchParams(location.search).get("ca") === "student";
  if (p.profesorReal && !proba){
    location.replace(RADACINA + "/predau/"); return;
  }
  return deseneaza();
}

/* --------------------------------------------------------- 1. intrarea -- */

function intrare(){
  const er = A.intoarcere?.eroare;
  gazda.innerHTML = `
    <div class="lg">
      <h1>Intră în cont</h1>
      <p class="lg__d">Ca să ți se salveze răspunsurile, ca să-ți văd progresul
      și ca să apari în prezență.</p>

      <div class="cutie">
        <button class="btn btn--tare" id="bt-github" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 20v-3.2M7 16.8c-2.6 0-3.4-1.7-3.4-3.4 0-1 .3-1.8.9-2.4-.3-.8-.3-2 .1-2.8 1 .1 2 .6 2.7 1.2.8-.2 1.7-.3 2.6-.3s1.8.1 2.6.3c.7-.6 1.7-1.1 2.7-1.2.4.8.4 2 .1 2.8.6.6.9 1.4.9 2.4 0 1.7-.8 3.4-3.4 3.4"/></svg>
          Intră cu GitHub</button>
        <p class="mic">Varianta pentru studenții de la curs. Ai oricum nevoie de
        cont GitHub de la cursul 3, iar activitatea din depozit se leagă singură
        de contul tău.</p>



        <div class="ori">sau</div>
        <label for="nume">Numele tău, pentru intrare ca invitat</label>
        <input id="nume" type="text" autocomplete="name" maxlength="60" placeholder="Cum să-ți spun">
        <button class="btn" id="bt-invitat" type="button">Intră ca invitat</button>
        <p class="mic">Fără cont și fără parolă, pentru cine vrea doar să încerce.
        Progresul se salvează, dar nu se leagă de numărul matricol și nu se poate
        transforma mai târziu într-un cont adevărat.</p>

        <p class="mesaj" id="mesaj"></p>
      </div>

      <p class="mic" style="text-align:center">Ce se salvează despre tine scrie în
      <a class="leg" href="${RADACINA}/date-personale/">pagina despre date personale</a>.</p>
    </div>`;

  if (er) msg(er === "access_denied"
    ? "Ai anulat intrarea cu GitHub. Mai încearcă o dată."
    : "GitHub a răspuns cu o eroare: " + er, "rau");

  el("bt-github").onclick = async e => {
    e.target.disabled = true;
    try { await A.intraCuGithub(); }
    catch (x) { e.target.disabled = false; msg(x.message, "rau"); }
  };
  el("bt-invitat").onclick = async e => {
    const nume = el("nume").value.trim();
    if (nume.length < 2){ msg("Scrie un nume, ca să te recunosc în listă.", "rau"); return; }
    e.target.disabled = true;
    try {
      const r = await A.intraCaInvitat(nume);
      if (!r?.ok) throw new Error(r?.mesaj || "nu a mers");
      unde();
    } catch (x) { e.target.disabled = false; msg(x.message, "rau"); }
  };
}

/* ====================================================================== */

async function deseneaza(){
  const invitat = A.esteInvitat(p);

  let progresBaza = new Set(), rasp = [], codul = [], prez = [], totaleBaza = new Map();
  try {
    const [g, r, c, z, s] = await Promise.all([
      A.sb.from("progres").select("sectiune_id, ultima_data"),
      A.sb.from("raspunsuri").select("intrebare_id, capitol, raspuns, corect, creat_la, sedinta_id")
          .order("creat_la", { ascending:false }),
      A.sb.from("rulari_cod").select("exercitiu_id, cod, trecut, creat_la, sedinta_id")
          .order("creat_la", { ascending:false }),
      A.sb.from("prezente").select("curs, marcat_la"),
      A.sb.from("sesiuni").select("capitol, total_nr")
    ]);
    (g.data || []).forEach(x => progresBaza.add(x.sectiune_id));
    rasp = r.data || []; codul = c.data || []; prez = z.data || [];
    (s.data || []).forEach(x => { if (x.capitol && x.total_nr)
      totaleBaza.set(x.capitol, Math.max(totaleBaza.get(x.capitol) || 0, x.total_nr)); });
  } catch { /* fără rețea, rămâne ce știe browserul */ }

  const harta = c => { try { return JSON.parse(localStorage.getItem(`dsw.harta.${c}`) || "null"); }
                       catch { return null; } };
  const local = c => { try { return new Set(JSON.parse(
                         localStorage.getItem(`dsw.parcurs.${c}`) || "{}").vizitate || []); }
                       catch { return new Set(); } };

  /* Vezi doar lecțiile ținute. Cifrele de mai jos rămân pe tot cursul: ele
     spun unde ajungi la final, nu unde am ajuns noi astăzi. */
  let listaL = LECTII;
  try {
    const Ora = await import("../js/ora.js?v=44");
    listaL = await Ora.lectiiVizibile(LECTII, p.profesorReal);
  } catch { /* fără bază, se văd toate */ }

  const lectii = listaL.map(l => {
    const cheie = "c" + l.nr, h = harta(cheie), viz = local(cheie);
    progresBaza.forEach(k => { const m = new RegExp(`^${cheie}/s(\\d+)$`).exec(k);
                               if (m) viz.add(+m[1] - 1); });
    const total = (h && h.total) || totaleBaza.get(cheie) || null;
    const q = rasp.filter(x => x.capitol === cheie);
    /* exercițiile cu cod n-au coloană de capitol; o citim din id: „c1-cod-…" */
    const cod = codul.filter(x => x.trecut && String(x.exercitiu_id).startsWith(cheie + "-"));
    const facute = new Set(q.map(x => x.intrebare_id)).size
                 + new Set(cod.map(x => x.exercitiu_id)).size;
    const qTotal = l.sarcini
      || (h ? h.verif.reduce((a, x) => a + (Array.isArray(x) ? x.length : x), 0) : null);
    /* Nicio cifră nu trece de numitorul ei. Progresul vechi poate ști de un
       slide 21 dintr-o versiune a lecției care avea 21; lecția are acum 19, și
       „slide 21 din 19" face situl să pară stricat. La fel, o sarcină scoasă
       din lecție rămâne în răspunsurile vechi: fără plafon iese „18 din 17". */
    const ultimBrut = viz.size ? Math.max(...viz) + 1 : 0;
    return { l, cheie, total, viz,
             vazute: Math.min(viz.size, total || viz.size),
             ultim: total ? Math.min(ultimBrut, total) : ultimBrut,
             qDate: qTotal ? Math.min(facute, qTotal) : facute,
             qCorecte: q.filter(x => x.corect).length, qTotal };
  });

  /* --- activitatea la seminar -------------------------------------------
     Singura componentă pe care o calculează situl. Regula, pe fiecare sarcină:
     corect la oră = întreg, corect acasă = jumătate, se ia cel mai bun dintre
     cele două. Suma pe seminar se raportează la câte sarcini are seminarul,
     iar seminarul valorează 2/7 indiferent câte are. „La oră" nu e o etichetă
     scrisă de client, e legătura cu o ședință: `sedinta_id`. */
  const ACT = NOTARE.activitate;
  const V_SEM = ACT.puncte / ACT.seminare;

  const activitatea = LECTII.filter(l => l.sarcini).map(l => {
    const cheie = "c" + l.nr, n = l.sarcini;
    const val = new Map();                       /* sarcină -> cât valorează */
    const pune = (id, laOra) => {
      const v = laOra ? 1 : ACT.acasa;
      if ((val.get(id) || 0) < v) val.set(id, v);
    };
    rasp.filter(x => x.capitol === cheie && x.corect)
        .forEach(x => pune(x.intrebare_id, !!x.sedinta_id));
    codul.filter(x => x.trecut && String(x.exercitiu_id).startsWith(cheie + "-"))
         .forEach(x => pune(x.exercitiu_id, !!x.sedinta_id));
    const suma = [...val.values()].reduce((a, b) => a + b, 0);
    return { l, cheie, n,
             facute: val.size,
             laOra:  [...val.values()].filter(v => v === 1).length,
             puncte: n ? Math.min(1, suma / n) * V_SEM : 0 };
  });

  const pActiv   = activitatea.reduce((a, x) => a + x.puncte, 0);
  const seminare = activitatea.filter(x => x.facute).length;
  const pct = NOTARE.componente.reduce((o, c) => (o[c.cheie] = c.puncte, o), {});
  const nr1 = v => v.toFixed(2).replace(".", ",");

  const totSlide = lectii.reduce((a, x) => a + (x.total || 0), 0);
  const totVaz   = lectii.reduce((a, x) => a + x.vazute, 0);
  const proc = totSlide ? Math.round(totVaz / totSlide * 100) : 0;
  const urm = lectii.find(x => x.l.stare === "gata" && x.total && x.vazute < x.total)
           || lectii.find(x => x.l.stare === "gata");
  const ini = (p.nume || "?").trim().split(/\s+/).slice(0,2).map(x => x[0] || "").join("").toUpperCase();

  gazda.innerHTML = `
  <header class="cnt__cap">
    <div class="cnt__cerc" style="--p:0"><i>${ini}</i></div>
    <div class="cnt__cine">
      <h1>${esc(p.nume) || "Contul meu"}</h1>
      <p class="cnt__meta">
        ${p.matricol ? `<span class="et">${esc(p.matricol)}</span>` : ""}
        ${p.grupa ? `<span class="et">grupa ${esc(p.grupa)}</span>` : ""}
        ${invitat ? `<span class="et et--nu">invitat</span>` : ""}
        ${p.github_login ? `<span class="et">@${esc(p.github_login)}</span>` : ""}
      </p>
    </div>
    <div class="cnt__act">
      ${p.profesorReal ? `<a class="btn btn--mic" href="${RADACINA}/predau/">Predau</a>` : ""}
      <button class="btn btn--mic" id="bt-iesi" type="button">Ieși din cont</button>
    </div>
  </header>

  ${!p.matricol && !invitat ? `<div class="nota" style="margin-bottom:30px">
    <div class="nota__et">Încă nu ești în lista grupei</div>
    <p>La prima oră scanezi codul de pe ecran și îți alegi numele din listă. Atât:
    de atunci tot ce faci se leagă de tine.</p></div>` : ""}

  ${invitat ? `<div class="nota" style="margin-bottom:30px">
    <div class="nota__et">Cont de invitat</div>
    <p>Progresul se salvează și se vede la profesor, dar contul nu e legat de un
    număr matricol și nu se poate transforma mai târziu. Dacă ești student la
    curs, ieși și intră cu GitHub.</p></div>` : ""}

  <!-- ----------------------------------------------------- notarea ----- -->
  <section class="cnt__s">
    <h2>Nota</h2>
    <p class="cnt__d">${NOTARE.total} puncte. Unul îl ai din oficiu. Două se adună
    singure, din ce lucrezi la seminar. Opt le pun eu: trei pentru teme, cinci
    pentru proiect.</p>

    <div class="nta">
      ${nota("seminar", nr1(pActiv), pct.seminar,
             seminare ? `${seminare} din ${ACT.seminare} seminare` : "încă niciun seminar",
             pActiv / pct.seminar)}
      ${nota("teme", null, pct.teme, "le notez eu, după fiecare temă", 0)}
      ${nota("proiect", null, pct.proiect, "se notează la prezentare", 0)}
      ${nota("oficiu", nr1(pct.oficiu), pct.oficiu, "îl ai", 1)}
    </div>

    <div class="nta__tot">
      <span>Acum, din ce se poate calcula</span>
      <b>${nr1(pActiv + pct.oficiu)}</b>
      <span>din ${NOTARE.total}; restul vin de la teme și de la proiect</span>
    </div>

    <details class="detalii">
      <summary>Seminar cu seminar, cum s-au adunat cele ${pct.seminar} puncte</summary>
      <table class="tabel" style="margin-top:12px">
        <thead><tr><th>Seminar</th><th>Făcute</th><th>La oră</th><th>Acasă</th>
          <th style="text-align:right">Puncte</th></tr></thead>
        <tbody>${activitatea.map(x => `<tr>
          <td>${x.l.titlu}</td>
          <td class="mono">${x.facute}/${x.n}</td>
          <td class="mono">${x.laOra}</td>
          <td class="mono">${x.facute - x.laOra}</td>
          <td class="mono" style="text-align:right">${nr1(x.puncte)}<small
            style="color:var(--text-3)">/${nr1(V_SEM)}</small></td>
        </tr>`).join("")}</tbody>
      </table>
      <p class="cnt__d" style="margin-top:10px">O sarcină făcută la oră valorează
      întreg, aceeași sarcină făcută acasă valorează jumătate, și se ia cea mai
      bună dintre cele două. Un seminar valorează ${nr1(V_SEM)} puncte, oricâte
      sarcini ar avea.</p>
    </details>

    <details class="detalii">
      <summary>Cum se calculează fiecare</summary>
      ${NOTARE.componente.map(c => `<div class="detalii__r">
        <b>${c.nume} · ${c.puncte} ${c.puncte === 1 ? "punct" : "puncte"}</b>
        <p>${c.d}</p></div>`).join("")}
    </details>
  </section>

  <!-- ----------------------------------------------------- lecțiile ---- -->
  <section class="cnt__s">
    <h2>Lecțiile</h2>
    <div class="lect">${lectii.map(randLectie).join("")}</div>
  </section>

  <!-- --------------------------------------------------- activitatea --- -->
  <section class="cnt__s">
    <h2>Ce ai lucrat</h2>
    <div class="file" role="tablist">
      <button class="file__f on" data-f="cod" type="button">Cod <i>${codul.length}</i></button>
      <button class="file__f" data-f="verif" type="button">Verificări <i>${rasp.length}</i></button>
      <button class="file__f" data-f="prez" type="button">Prezențe <i>${prez.length}</i></button>
    </div>

    <div class="file__c" data-c="cod">${codul.length ? `
      <div class="codl">${[...new Map(codul.map(c => [c.exercitiu_id, c])).values()]
        .map(c => `<div class="codl__r ${c.trecut ? "bun" : ""}">
          <span class="codl__id">${esc(c.exercitiu_id)}</span>
          <code>${esc(c.cod)}</code>
          <span class="codl__c">${cand(c.creat_la)}</span></div>`).join("")}</div>`
      : `<p class="cnt__gol">Niciun exercițiu cu cod, încă.</p>`}</div>

    <div class="file__c" data-c="verif" hidden>${rasp.length ? `
      <table class="tabel">
        <thead><tr><th>Verificare</th><th>Lecția</th><th>Rezultat</th><th>Când</th></tr></thead>
        <tbody>${rasp.map(r => `<tr>
          <td class="mono">${esc(r.intrebare_id)}</td><td class="mono">${esc(r.capitol) || "—"}</td>
          <td>${r.corect ? '<span class="et et--ok">corect</span>'
                         : '<span class="et et--nu">greșit</span>'}</td>
          <td class="mono">${cand(r.creat_la)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="cnt__gol">Nicio verificare, încă.</p>`}</div>

    <div class="file__c" data-c="prez" hidden>${prez.length ? `
      <div class="codl">${prez.map(z => `<div class="codl__r bun">
        <span class="codl__id">${esc(z.curs)}</span>
        <code>prezent</code>
        <span class="codl__c">${cand(z.marcat_la)}</span></div>`).join("")}</div>`
      : `<p class="cnt__gol">Nicio prezență marcată. La începutul orei, scanează
         codul de pe ecran.</p>`}</div>
  </section>

  <!-- --------------------------------------------- proiect și echipă --- -->
  <section class="cnt__s">
    <h2>Proiect și echipă</h2>
    <p class="cnt__d">Cinci puncte din ${NOTARE.total}, cea mai mare bucată din
    notă. Se face în echipă și se prezintă la ultimul seminar, dar nota e pe om.</p>
    <div class="cnt__gol" style="border:1px dashed var(--linie-2);border-radius:11px;
      padding:22px 20px;text-align:center">
      Echipele se formează în a doua parte a semestrului.<br>
      Aici o să apară echipa ta, depozitul ei pe GitHub, și nota.
    </div>
  </section>`;

  el("bt-iesi").onclick = async () => { await A.iesi(); location.href = RADACINA + "/"; };
  gazda.querySelectorAll(".file__f").forEach(b => b.onclick = () => {
    gazda.querySelectorAll(".file__f").forEach(x => x.classList.toggle("on", x === b));
    gazda.querySelectorAll(".file__c").forEach(x => x.hidden = x.dataset.c !== b.dataset.f);
  });
}

function nota(cheie, acum, max, sub, fractie){
  const c = NOTARE.componente.find(x => x.cheie === cheie);
  const pr = Math.round(Math.min(1, fractie || 0) * 100);
  return `<div class="nt ${acum === null ? "nt--astept" : ""}">
    <span class="nt__n">${c.nume}</span>
    <span class="nt__v">${acum === null ? "—" : String(acum).replace(".", ",")}<small>/${max}</small></span>
    <span class="nt__b"><i style="width:${pr}%"></i></span>
    <span class="nt__s">${sub}</span>
    <span class="nt__d">${c.scurt}</span>
  </div>`;
}

function randLectie(x){
  const proc = x.total ? Math.round(x.vazute / x.total * 100) : 0;
  const stare = x.l.stare !== "gata" ? "în lucru"
              : !x.total             ? "nedeschisă"
              : proc >= 100          ? "parcursă"
              : `${x.vazute} din ${x.total} slide-uri văzute`;
  /* intrarea e mereu pagina lecției: de acolo se începe de la capăt */
  const unde = `${x.l.cheie}/`;
  return `<a class="lect__r" href="${RADACINA}/${unde}">
    <span class="lect__n">${String(x.l.nr).padStart(2,"0")}</span>
    <span class="lect__m">
      <span class="lect__t">${x.l.titlu}</span>
      <span class="lect__s">${stare}${x.qTotal ? ` · sarcini ${Math.min(x.qDate, x.qTotal)}/${x.qTotal}` : ""}</span>
      <span class="lect__b"><i style="width:${proc}%"></i></span>
    </span>
    <span class="lect__p">${x.total ? proc + "%" : "—"}</span>
  </a>`;
}

await unde();
A.laSchimbare(() => unde());
</script>
<script type="module" src="../js/antet.js?v=44"></script>
<script type="module" src="../js/subsol.js?v=44"></script>
</body>
</html>
