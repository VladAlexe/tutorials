<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intră în cont — Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sistem.css?v=7">
<link rel="stylesheet" href="../css/cont.css?v=7">
<script src="../js/tema.js?v=7"></script>
<style>
  .lg{max-width:460px;margin:0 auto;padding:46px 0 80px}
  .lg h1{font-size:30px;margin-bottom:10px;text-align:center}
  .lg__d{font-family:var(--sans);font-size:15px;color:var(--text-2);text-align:center;
    margin:0 0 30px;line-height:1.55;max-width:none}
  .cutie{border:1px solid var(--linie);border-radius:13px;background:var(--panza);
    padding:22px 24px;box-shadow:var(--umbra)}
  .cutie + .cutie{margin-top:13px}
  .cutie label{display:block;font-family:var(--sans);font-size:13px;font-weight:500;
    margin-bottom:7px}
  .cutie input{width:100%;padding:11px 14px;border:1px solid var(--linie-2);
    border-radius:9px;background:var(--fundal);font-family:var(--sans);font-size:15.5px;
    outline:none;transition:.13s}
  .cutie input:focus{border-color:var(--accent)}
  .cutie .btn{width:100%;justify-content:center;margin-top:12px;padding:12px}
  .mic{font-family:var(--sans);font-size:12.5px;color:var(--text-3);line-height:1.5;
    margin:13px 0 0;max-width:none}
  .ori{display:flex;align-items:center;gap:13px;margin:18px 0;font-family:var(--mono);
    font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.11em}
  .ori::before,.ori::after{content:"";flex:1;height:1px;background:var(--linie)}
  .mesaj{font-family:var(--sans);font-size:14px;line-height:1.5;padding:12px 15px;
    border-radius:9px;margin-top:14px;display:none;max-width:none}
  .mesaj.vazut{display:block}
  .mesaj.rau{background:var(--nu-slab);color:var(--nu)}
  .mesaj.bun{background:var(--ok-slab);color:var(--ok)}
  .pasi{display:flex;gap:7px;justify-content:center;margin-bottom:26px}
  .pasi i{width:34px;height:3px;border-radius:2px;background:var(--linie);display:block}
  .pasi i.on{background:var(--accent)}
</style>
</head>
<body>

<div id="antet" data-aici="Cont"></div>

<main>
<div class="pagina">
  <div class="lg" id="lg"><p class="incarca">Se încarcă…</p></div>
</div>
</main>

<div id="subsol"></div>

<script type="module">
import { RADACINA } from "../js/curs.js?v=7";

const lg = document.getElementById("lg");
const msg = (text, fel) => {
  const m = document.getElementById("mesaj");
  if (!m) return;
  m.textContent = text; m.className = "mesaj vazut " + (fel || "");
};

let A, CFG, p;
try {
  A = await import("../js/auth.js?v=7");
  CFG = await import("../js/supabase-config.js?v=7");
} catch (e) {
  lg.innerHTML = `<div class="nota"><div class="nota__et">Nu merge</div>
    <p>Nu pot încărca autentificarea: ${e.message}</p></div>`;
  throw e;
}

/* dacă ne-am întors de la GitHub cu o eroare, o spunem pe șleau */
const er = A.intoarcere?.eroare;

async function desen(){
  p = await A.profil({ proaspat:true });

  /* dacă am plecat spre GitHub de pe pagina de prezență, ne întoarcem acolo:
     altfel jetonul din codul QR s-ar pierde la întoarcere */
  if (p.autentificat){
    let inapoi = null;
    try { inapoi = sessionStorage.getItem("dsw.intra"); sessionStorage.removeItem("dsw.intra"); }
    catch {}
    if (inapoi){ location.replace(inapoi); return; }
  }

  /* --- 1. nu e nimeni conectat ------------------------------------------ */
  if (!p.autentificat){
    lg.innerHTML = `
      <div class="pasi"><i class="on"></i><i></i></div>
      <h1>Intră în cont</h1>
      <p class="lg__d">Ca să ți se salveze răspunsurile și ca să apari în
      progresul grupei.</p>

      <div class="cutie">
        <button class="btn btn--tare" id="bt-github" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 20v-3.2M7 16.8c-2.6 0-3.4-1.7-3.4-3.4 0-1 .3-1.8.9-2.4-.3-.8-.3-2 .1-2.8 1 .1 2 .6 2.7 1.2.8-.2 1.7-.3 2.6-.3s1.8.1 2.6.3c.7-.6 1.7-1.1 2.7-1.2.4.8.4 2 .1 2.8.6.6.9 1.4.9 2.4 0 1.7-.8 3.4-3.4 3.4"/></svg>
          Intră cu GitHub</button>
        <p class="mic">Varianta pentru studenții de la curs. Ai oricum nevoie de
        cont GitHub de la cursul 3, iar activitatea din depozit se leagă singură
        de contul tău.</p>

        ${CFG.PERMITE_EMAIL ? `
        <div class="ori">sau</div>
        <label for="email">Adresa de email</label>
        <input id="email" type="email" autocomplete="email" placeholder="nume@stud.ubbcluj.ro">
        <button class="btn" id="bt-email" type="button">Trimite-mi o legătură</button>` : ""}

        <div class="ori">sau</div>
        <label for="nume">Numele tău, pentru intrare ca invitat</label>
        <input id="nume" type="text" autocomplete="name" maxlength="60" placeholder="Cum să-ți spun">
        <button class="btn" id="bt-invitat" type="button">Intră ca invitat</button>
        <p class="mic">Fără cont și fără parolă, pentru cine vrea doar să încerce.
        Progresul se salvează, dar nu se leagă de numărul matricol și nu se poate
        transforma mai târziu într-un cont adevărat.</p>

        <p class="mesaj" id="mesaj"></p>
      </div>

      <p class="mic" style="text-align:center">Ce se salvează despre tine scrie în
      <a class="leg" href="${RADACINA}/date-personale/">pagina despre date personale</a>.</p>`;

    if (er) msg(er === "access_denied"
      ? "Ai anulat intrarea cu GitHub. Mai încearcă o dată."
      : "GitHub a răspuns cu o eroare: " + er, "rau");

    document.getElementById("bt-github").onclick = async e => {
      e.target.disabled = true;
      try { await A.intraCuGithub(); }
      catch (x) { e.target.disabled = false; msg(x.message, "rau"); }
    };
    document.getElementById("bt-email")?.addEventListener("click", async () => {
      const v = document.getElementById("email").value;
      try { await A.intraCuEmail(v); msg("Ți-am trimis o legătură pe email. Deschide-o de pe calculatorul ăsta.", "bun"); }
      catch (x) { msg(x.message, "rau"); }
    });
    document.getElementById("bt-invitat").onclick = async e => {
      const nume = document.getElementById("nume").value.trim();
      if (nume.length < 2){ msg("Scrie un nume, ca să te recunosc în listă.", "rau"); return; }
      e.target.disabled = true;
      try {
        const r = await A.intraCaInvitat(nume);
        if (!r?.ok) throw new Error(r?.mesaj || "nu a mers");
        location.href = RADACINA + "/panou/";
      } catch (x) { e.target.disabled = false; msg(x.message, "rau"); }
    };
    return;
  }

  /* --- 1b. profesorul n-are număr matricol; are casa lui ---------------- */
  if (p.profesorReal && A.modVizualizare() !== "student"){
    location.replace(RADACINA + "/profesor/");
    return;
  }

  /* --- 2. conectat, dar fără matricol ----------------------------------- */
  if (!p.matricol){
    lg.innerHTML = `
      <div class="pasi"><i class="on"></i><i class="on"></i></div>
      <h1>Numărul matricol</h1>
      <p class="lg__d">Ești conectat${p.email ? " ca <strong>" + p.email + "</strong>" : ""}.
      Mai rămâne să-ți leg contul de numărul tău matricol, ca să te pot găsi în listă.</p>

      <div class="cutie">
        <label for="mat">Numărul matricol</label>
        <input id="mat" type="text" inputmode="numeric" autocomplete="off"
               placeholder="de exemplu 900001" autofocus>
        <button class="btn btn--tare" id="bt-leg" type="button">Leagă contul</button>
        <p class="mic">Se poate face o singură dată. Dacă greșești, scrie-mi și îl schimb eu.</p>
        <p class="mesaj" id="mesaj"></p>
      </div>

      <p class="mic" style="text-align:center">
        <button class="leg" id="bt-iesi" type="button"
          style="background:none;border:0;padding:0;font:inherit;color:var(--accent-text);cursor:pointer">
          Nu e contul tău? Ieși.</button></p>`;

    const bt = document.getElementById("bt-leg");
    const camp = document.getElementById("mat");
    const trimite = async () => {
      const v = camp.value.trim();
      if (!v){ msg("Scrie numărul matricol.", "rau"); return; }
      bt.disabled = true; bt.textContent = "Se verifică…";
      try {
        const r = await A.revendicaMatricol(v);
        if (r?.ok){ msg(`Gata, ${r.nume}. Te duc la contul tău…`, "bun");
                    setTimeout(() => location.href = RADACINA + "/panou/", 900); }
        else { msg(r?.mesaj || "Nu a mers.", "rau");
               bt.disabled = false; bt.textContent = "Leagă contul"; }
      } catch (x){ msg(x.message, "rau"); bt.disabled = false; bt.textContent = "Leagă contul"; }
    };
    bt.onclick = trimite;
    camp.addEventListener("keydown", e => { if (e.key === "Enter") trimite(); });
    document.getElementById("bt-iesi").onclick = async () => { await A.iesi(); desen(); };
    return;
  }

  /* --- 3. totul e pus la punct ------------------------------------------ */
  lg.innerHTML = `
    <h1>Ești în cont</h1>
    <p class="lg__d"><strong>${p.nume}</strong>, ${p.matricol}${p.grupa ? ", grupa " + p.grupa : ""}.</p>
    <div class="cutie" style="text-align:center">
      <a class="btn btn--tare" href="${RADACINA}/panou/">Contul și progresul meu</a>
      <a class="btn" href="${RADACINA}/c1-introducere-si-mediu/lectie/">Mergi la lecție</a>
    </div>`;
}

await desen();
A.laSchimbare(() => desen());
</script>
<script type="module" src="../js/antet.js?v=7"></script>
<script type="module" src="../js/subsol.js?v=7"></script>
</body>
</html>
