<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intră la oră · Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../css/fonturi.css?v=97">
<link rel="stylesheet" href="../css/sistem.css?v=97">
<script src="../js/tema.js?v=97"></script>
<style>
  /* Un ecran de telefon, ținut în mână, într-o sală. Un singur lucru de făcut
     pe pas, scris mare, cu ținte de atins cu degetul mare. */
  body{display:grid;place-items:center;min-height:100dvh;padding:22px}
  .in{width:100%;max-width:420px}
  .in__marca{display:flex;align-items:center;gap:9px;margin-bottom:26px;
    justify-content:center;color:var(--text-2)}
  .in__marca span{font-family:var(--sans);font-size:var(--t2);font-weight:600;color:var(--text)}
  .in__et{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);text-align:center;margin:0 0 7px}
  .in h1{font-size:var(--t6);margin:0 0 8px;text-align:center;letter-spacing:-.022em}
  .in__d{font-family:var(--sans);font-size:var(--t3);color:var(--text-2);text-align:center;
    margin:0 0 24px;line-height:1.5;max-width:none}

  .cutie{border:1px solid var(--linie);border-radius:14px;background:var(--panza);
    padding:20px 22px;box-shadow:var(--umbra)}
  .cutie[hidden]{display:none}
  .cutie label{display:block;font-family:var(--sans);font-size:var(--t1);font-weight:500;
    margin-bottom:7px;color:var(--text-2)}
  .cutie input{width:100%;padding:11px 14px;border:1px solid var(--linie-2);
    border-radius:9px;background:var(--fundal);font-family:var(--sans);font-size:var(--t4);
    outline:none;transition:.13s}
  .cutie input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-slab)}
  .cutie .btn{width:100%;justify-content:center;margin-top:12px;padding:12px}
  .cod-in{font-family:var(--mono);font-size:var(--t6);
    text-align:center;text-indent:.28em}

  .ori{display:flex;align-items:center;gap:12px;margin:20px 0;
    font-family:var(--sans);font-size:var(--t1);color:var(--text-3);}
  .ori::before,.ori::after{content:"";flex:1;height:1px;background:var(--linie)}
  .mic{font-family:var(--sans);font-size:var(--t1);color:var(--text-3);line-height:1.5;
    margin:14px 0 0;max-width:none}
  .mic a{color:var(--accent-text)}

  /* Lista grupei: nume, atât, și doar cele încă nealese. Matricolul nu pleacă
     de pe server; fiecare nume vine cu o cheie aleatoare (db/22). */
  .lista{display:flex;flex-direction:column;gap:6px;max-height:48vh;
    overflow-y:auto;margin:0 0 4px;padding:1px}
  .nume{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    font-family:var(--sans);font-size:var(--t3);padding:12px 14px;border-radius:10px;
    border:1px solid var(--linie);background:var(--panza);color:var(--text);
    cursor:pointer;transition:.12s}
  .nume:hover{border-color:var(--linie-2);background:var(--panza-2)}
  .nume.on{border-color:var(--accent);background:var(--accent-slab);font-weight:600;
    box-shadow:0 0 0 2px var(--accent-slab)}
  .nume[disabled]{opacity:.5;cursor:not-allowed}
  .nume small{margin-left:auto;font-family:var(--sans);font-size:var(--t1);
    color:var(--text-3);}
  .cauta{margin-bottom:10px}

  .mesaj{font-family:var(--sans);font-size:var(--t2);line-height:1.5;padding:12px 15px;
    border-radius:9px;margin-top:14px;display:none}
  .mesaj.vazut{display:block}
  .mesaj.rau{background:var(--nu-slab);color:var(--nu)}
  .mesaj.bun{background:var(--ok-slab);color:var(--ok)}

  .schelet{height:44px;border-radius:10px;background:var(--panza-2);
    animation:puls 1.5s infinite;margin-bottom:6px}
  @keyframes puls{0%,100%{opacity:.5}50%{opacity:.85}}
  .inf{margin:0 0 12px;padding-left:18px;font-size:var(--t2);line-height:1.55}
  .inf li{margin-bottom:6px}
  .bifa{display:flex;gap:10px;align-items:flex-start;margin:14px 0 12px;font-size:var(--t2);line-height:1.45;cursor:pointer}
  .bifa input{margin-top:3px;width:16px;height:16px;flex:none}
</style>
</head>
<body>

<main class="in">
  <div class="in__marca">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="6" r="2.3" stroke="currentColor" stroke-width="1.7"/><circle cx="5" cy="18" r="2.3" stroke="currentColor" stroke-width="1.7"/><circle cx="19" cy="12" r="2.3" stroke="currentColor" stroke-width="1.7"/><path d="M7.2 7.1 16.8 11M7.2 16.9 16.8 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Fluxuri de lucru</span>
  </div>

  <p class="in__et" id="et" hidden></p>
  <h1 id="titlu">Intră la oră</h1>
  <p class="in__d" id="sub">Se încarcă…</p>

  <div id="pas"></div>
  <p class="mesaj" id="mesaj"></p>
</main>

<script type="module">
/* ===========================================================================
   INTRAREA ÎN ORĂ

   Trei pași, și niciunul nu cere ceva ce studentul ar putea greși:

     1. codul   vine din QR (?c=) sau se tastează de pe proiector. Codul duce
                lecția, grupa și ședința, deci nimeni nu alege grupa, deci
                nimeni nu o alege greșit.
     2. contul  GitHub, dacă are; invitat, dacă nu. Butonul de GitHub nu cere
                nimic de scris, iar numele de utilizator vine verificat.
     3. cine    lista grupei, un tap. Fără matricol de tastat. A doua oară
                pasul ăsta nu mai există: te știe.

   Matricolul nu iese din server niciodată: lista vine cu o cheie aleatoare
   pentru fiecare nume, iar înapoi se trimite cheia. Alegerea cere GitHub.
   =========================================================================== */

const el = id => document.getElementById(id);
const par = new URLSearchParams(location.search);
const RAD = "/data-science-workflows";

/* ?c= e codul ședinței; ?j= era jetonul vechi de prezență, îl primim la fel */
let cod  = (par.get("c") || par.get("j") || "").trim().toUpperCase() || null;
let spre = par.get("spre") || null;

function mesaj(text, fel){
  const m = el("mesaj");
  m.textContent = text || "";
  m.className = "mesaj " + (text ? "vazut " : "") + (fel || "");
}
function cap(et, titlu, sub){
  el("et").textContent = et || ""; el("et").hidden = !et;
  el("titlu").textContent = titlu;
  el("sub").textContent = sub;
}

let A, O;
try {
  A = await import("../js/auth.js?v=97");
  O = await import("../js/ora.js?v=97");
} catch (e) {
  cap("", "Intră la curs", "Autentificarea nu a putut fi încărcată: " + e.message);
  throw e;
}

const p = await A.profil().catch(() => ({ autentificat:false }));

if (!cod) pasCod();
else      await dupaCod();

/* --- pasul 1: codul ------------------------------------------------------ */

function pasCod(){
  cap("", "Intră la oră",
      "Introdu codul afișat pe ecranul din sală. Dacă ai scanat codul QR, " +
      "acest pas este deja completat.");
  el("pas").innerHTML = `
    <div class="cutie">
      <label for="cod">Codul de pe ecran</label>
      <input id="cod" type="text" inputmode="latin" autocomplete="off" maxlength="6"
             spellcheck="false" placeholder="6 caractere" class="cod-in">
      <button class="btn btn--tare" id="bt-cod" type="button">Intră la oră</button>
      <p class="mic">Dacă nu este nicio oră în desfășurare, poți
        <a href="${RAD}/">accesa cursul individual</a>.</p>
    </div>`;
  const i = el("cod");
  i.focus();
  const du = async () => {
    const v = i.value.trim().toUpperCase();
    if (v.length < 4){ mesaj("Codul are șase caractere.", "rau"); i.focus(); return; }
    cod = v; mesaj(""); await dupaCod();
  };
  el("bt-cod").onclick = du;
  i.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); du(); } });
}

/* --- ce e în spatele codului --------------------------------------------- */

async function dupaCod(){
  el("pas").innerHTML = `<div class="cutie"><div class="schelet"></div>
    <div class="schelet"></div></div>`;

  if (!p.autentificat){ pasCont(); return; }

  const s = await O.dupaCod(cod);
  if (!s?.ok){
    /* Un cod greșit și o bază nepregătită arată la fel din pagină, dar sunt
       lucruri foarte diferite. Dacă funcția lipsește, o spunem: altfel omul
       schimbă codul de cinci ori degeaba. */
    if (O.lipsesteBaza()){
      cap("", "Baza de date nu este pregătită",
          "Funcțiile de intrare nu există încă. Rulează integral db/15-panou-si-intrare.sql în Supabase și reîncarcă pagina.");
      el("pas").innerHTML = `<div class="cutie"><p class="mic"
        style="color:var(--nu)">${O.ultimaEroare() || ""}</p></div>`;
      return;
    }
    /* ora închisă nu e același lucru cu cod greșit: una te lasă în lecție,
       cealaltă te trimite să te uiți din nou pe ecran */
    if (s?.inchisa){
      cap("", "Ora s-a încheiat", s.mesaj);
      el("pas").innerHTML = `<div class="cutie">
        <a class="btn btn--tare" href="${lectieDe(s.capitol)}"
           style="width:100%;justify-content:center">Deschide lecția</a>
        <p class="mic">Activitatea se salvează, dar nu se mai înregistrează la prezență.</p>
      </div>`;
      return;
    }
    mesaj(s?.mesaj || "Codul nu este valid.", "rau"); pasCod(); return;
  }

  spre = spre || lectieDe(s.capitol);

  /* Profesorul care își scanează propriul cod nu e un student fără nume. Nu-i
     arăt lista grupei: l-ar pune să aleagă numele altcuiva. */
  if (s.profesor){ pasProfesor(s); return; }

  /* Informarea GDPR: o dată pe cont și pe versiune a politicii. Dacă funcția
     nu există încă în bază (db/22 nerulat), întoarce null și nu blocăm ora. */
  if (await O.informareConfirmata() === false){ pasInformare(() => continua(s)); return; }
  continua(s);
}

function continua(s){
  /* Deja conectat și legat de un nume (student sau invitat)? Nu mai întreb
     nimic: „Bine ai venit, Mihai” și intră. Lista apare doar prima dată. */
  if (s.cunoscut || p.matricol) pasRevenit({ ...s, nume: s.nume || p.nume });
  else pasLista(s);
}

/* --- informarea GDPR ------------------------------------------------------
   Nu e consimțământ (temeiul e interesul legitim), ci dovada că studentul a
   primit informarea. Se cere o dată pe cont, și din nou când se schimbă
   versiunea politicii (O.INFORMARE). */

function pasInformare(dupa){
  cap("protecția datelor", "Înainte de prima oră",
      "Situl înregistrează activitatea la curs. Citește politica de confidențialitate și confirmă luarea la cunoștință.");
  el("pas").innerHTML = `
    <div class="cutie">
      <ul class="inf">
        <li>Operator: Vlad Alexe, titularul cursului.</li>
        <li>Se prelucrează numele, contul GitHub, răspunsurile, prezența și notele, pentru organizarea și evaluarea cursului.</li>
        <li>Datele tale sunt accesibile doar ție și titularului. Datele se șterg cel târziu la 31 martie 2027.</li>
        <li>Ai dreptul de acces, rectificare, ștergere, restricționare, portabilitate și opoziție.</li>
      </ul>
      <p class="mic"><a href="${RAD}/date-personale/" target="_blank" rel="noopener">Citește politica de confidențialitate completă ↗</a></p>
      <label class="bifa"><input type="checkbox" id="inf-ok">
        <span>Am citit și am luat la cunoștință Politica de confidențialitate (versiunea ${O.INFORMARE}).</span></label>
      <button class="btn btn--tare" id="bt-inf" type="button" disabled>Confirm și intru</button>
      <p class="mic">Confirmarea nu este un consimțământ. Se păstrează data și versiunea, ca dovadă a informării.</p>
    </div>`;
  el("inf-ok").onchange = e => { el("bt-inf").disabled = !e.target.checked; };
  el("bt-inf").onclick = async () => {
    const b = el("bt-inf"); b.disabled = true; b.textContent = "Se salvează…";
    const r = await O.confirmaInformarea();
    if (!r?.ok){ b.disabled = false; b.textContent = "Confirm și intru";
                 mesaj(r?.mesaj || "Nu s-a putut salva confirmarea.", "rau"); return; }
    dupa();
  };
}

/* --- pasul 2: contul ----------------------------------------------------- */

function pasCont(){
  cap("cod valid", "Autentificare",
      "Intră cu GitHub: astfel îți alegi numele din lista grupei, iar activitatea " +
      "se asociază contului tău. Același cont este folosit, de la cursul 3, pentru depozitul echipei.");
  el("pas").innerHTML = `
    <div class="cutie">
      <button class="btn btn--tare" id="bt-gh" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 20v-3.2M7 16.8c-2.6 0-3.4-1.7-3.4-3.4 0-1 .3-1.8.9-2.4-.3-.8-.3-2 .1-2.8 1 .1 2 .6 2.7 1.2.8-.2 1.7-.3 2.6-.3s1.8.1 2.6.3c.7-.6 1.7-1.1 2.7-1.2.4.8.4 2 .1 2.8.6.6.9 1.4.9 2.4 0 1.7-.8 3.4-3.4 3.4"/></svg>
        Intru cu GitHub</button>
      <p class="mic">Dacă nu ai încă un cont, crearea lui durează câteva minute:
        <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup ↗</a>.
        Contul poate fi creat acasă și asociat la ora următoare.</p>

      <div class="ori">sau, doar pentru această oră</div>

      <label for="nume">Numele tău</label>
      <input id="nume" type="text" autocomplete="name" maxlength="60" placeholder="Nume și prenume">
      <button class="btn" id="bt-inv" type="button">Intru fără cont</button>
      <p class="mic">Progresul se salvează și apare la profesor cu mențiunea „invitat”. Numele
        din lista grupei poate fi ales doar prin GitHub.</p>
    </div>`;

  el("bt-gh").onclick = async () => {
    try { sessionStorage.setItem("dsw.intra", location.href); } catch {}
    try { await A.intraCuGithub(); } catch (e) { mesaj(e.message, "rau"); }
  };
  el("bt-inv").onclick = async () => {
    const b = el("bt-inv"), nume = el("nume").value.trim();
    if (nume.length < 2){ mesaj("Introdu un nume, pentru identificarea în listă.", "rau");
                          el("nume").focus(); return; }
    b.disabled = true; b.textContent = "Se conectează…";
    try {
      const r = await A.intraCaInvitat(nume);
      if (!r?.ok) throw new Error(r?.mesaj || "Intrarea nu a reușit.");
      location.reload();
    } catch (e) { b.disabled = false; b.textContent = "Intru fără cont"; mesaj(e.message, "rau"); }
  };
}

/* --- pasul 3: lista grupei ------------------------------------------------
   Nu un formular. Numele oamenilor din grupa aia, și un tap. Un formular cu
   nume, matricol și grupă ar fi douăzeci și una de ocazii de a scrie greșit,
   plus cel puțin doi care aleg grupa cealaltă. */

async function pasLista(s){
  cap(s.titlu || "la oră", "Alege-ți numele",
      "Selectează-ți numele din listă. Pasul se face o singură dată pe semestru: din acel moment, numele este asociat contului tău GitHub.");

  const oameni = await O.listaGrupei(cod) || [];
  /* Lista goală poate însemna două lucruri: grupa n-are studenți încărcați,
     sau funcția lipsește. În ambele cazuri intrarea cu numele merge, dar
     merită spus care din ele e. */
  if (!oameni.length){ pasFaraLista(s, false, O.lipsesteBaza()); return; }

  el("pas").innerHTML = `
    <div class="cutie">
      ${oameni.length > 9 ? `<input class="cauta" id="cauta" type="search"
         placeholder="Caută numele" autocomplete="off">` : ""}
      <div class="lista" id="lista">
        ${oameni.map(o => `
          <button class="nume" type="button" data-k="${o.cheie}" ${o.luat ? "disabled" : ""}>
            ${o.nume}${o.luat ? "<small>deja ales</small>" : ""}</button>`).join("")}
      </div>
      <button class="btn btn--tare" id="bt-sunt" type="button" disabled>Confirm selecția</button>
      <p class="mic"><a href="#" id="bt-nu">Numele meu nu apare în listă</a></p>
    </div>`;

  let ales = null;
  el("lista").addEventListener("click", e => {
    const b = e.target.closest(".nume"); if (!b || b.disabled) return;
    el("lista").querySelectorAll(".nume").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); ales = b.dataset.k;
    el("bt-sunt").disabled = false;
  });

  el("cauta")?.addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    el("lista").querySelectorAll(".nume").forEach(b =>
      b.hidden = !!q && !b.textContent.toLowerCase().includes(q));
  });

  el("bt-sunt").onclick = async () => {
    if (!ales) return;
    const b = el("bt-sunt"); b.disabled = true; b.textContent = "Se conectează…";
    const r = await O.intra(cod, ales);
    if (!r?.ok){ b.disabled = false; b.textContent = "Confirm selecția";
                 mesaj(r?.mesaj || "Intrarea nu a reușit.", "rau"); return; }
    gata(r.nume, s);
  };

  el("bt-nu").onclick = e => { e.preventDefault(); pasFaraLista(s, true); };
}

/* Venit mai târziu, transferat, sau pur și simplu lipsă din listă. Nu intră
   direct în date: rămâne invitat, cu numele lui, iar profesorul îl leagă. */
function pasFaraLista(s, dinLista, faraBaza){
  cap(s.titlu || "la oră", "Introdu-ți numele",
      dinLista   ? "Intri ca invitat, iar profesorul te adaugă în listă după oră."
    : faraBaza   ? "Lista grupei nu poate fi citită încă. Intri cu numele tău."
                 : "Lista grupei nu este pregătită încă. Intri cu numele tău.");
  el("pas").innerHTML = `
    <div class="cutie">
      <label for="nume2">Numele tău</label>
      <input id="nume2" type="text" autocomplete="name" maxlength="60"
             placeholder="Nume și prenume">
      <button class="btn btn--tare" id="bt-ok" type="button">Intru la oră</button>
      <p class="mic">Activitatea din această oră se salvează și este vizibilă pentru profesor.
        Se asociază contului tău după ce profesorul te adaugă în listă.</p>
    </div>`;
  el("nume2").focus();
  el("bt-ok").onclick = () => {
    const nume = el("nume2").value.trim();
    if (nume.length < 3){ mesaj("Introdu numele complet, pentru identificare.", "rau"); return; }
    gata(nume, s);
  };
}

/* --- tu, care predai ------------------------------------------------------ */

function pasProfesor(s){
  cap("profesor", s.titlu || "Ora ta",
      "Ai scanat codul propriei ore. Lecția se deschide la slide-ul afișat pe proiector.");
  el("pas").innerHTML = `
    <div class="cutie">
      <a class="btn btn--tare" href="${spre}#${s.slide_nr || 1}"
         style="width:100%;justify-content:center">Deschide lecția</a>
      <p class="mic">Prezența profesorului nu se înregistrează.</p>
    </div>`;
}

/* --- a doua oară încolo --------------------------------------------------- */

function pasRevenit(s){
  cap(s.titlu || "la oră", `Bine ai venit${s.nume ? ", " + prenume(s.nume) : ""}`,
      `Intri în ${s.titlu}.`);
  el("pas").innerHTML = `
    <div class="cutie">
      <button class="btn btn--tare" id="bt-du" type="button">Intru la oră</button>
      <p class="mic"><a href="#" id="bt-alt">Nu sunt eu</a></p>
    </div>`;
  el("bt-du").onclick = () => gata(s.nume, s);
  el("bt-alt").onclick = async e => { e.preventDefault(); await A.iesi(); location.reload(); };
}

/* --- gata ---------------------------------------------------------------- */

function gata(nume, s){
  const unde = spre || lectieDe(s?.capitol);
  cap("", `Intrare înregistrată${nume ? ", " + prenume(nume) : ""}`,
      "Lecția se deschide. Prezența se stabilește din activitatea din lecție, nu din scanarea codului.");
  el("pas").innerHTML = `<div class="cutie">
    <a class="btn btn--tare" href="${unde}"
       style="width:100%;justify-content:center">Deschide lecția</a></div>`;
  setTimeout(() => location.href = unde, 900);
}

/* prenumele: în listă numele sunt „Nume Prenume”, la invitați e ce au scris */
function prenume(n){
  const b = String(n || "").trim().split(/\s+/);
  return b.length > 1 && p.matricol && !String(p.matricol).startsWith("G-") ? b[b.length - 1] : b[0];
}

function lectieDe(capitol){
  const nr = parseInt(String(capitol || "c1").replace("c",""), 10) || 1;
  const chei = ["c1-introducere-si-mediu","c2-colectarea-prin-api","c3-versionare-git",
                "c4-curatarea-datelor","c5-agregare-si-baze-de-date",
                "c6-analiza-exploratorie","c7-variabile-si-model","c8-raportare"];
  return `${RAD}/${chei[nr-1] || chei[0]}/lectie/`;
}
</script>
</body>
</html>
