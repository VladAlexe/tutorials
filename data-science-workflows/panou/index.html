<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contul meu — Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sistem.css?v=7">
<link rel="stylesheet" href="../css/cont.css?v=7">
<script src="../js/tema.js?v=7"></script>
</head>
<body>

<div id="antet" data-aici="Contul meu"></div>

<main>
<div class="pagina">
  <div id="pagina"><p class="incarca">Se încarcă…</p></div>
</div>
</main>

<div id="subsol"></div>

<script type="module">
import { LECTII, NOTARE, RADACINA } from "../js/curs.js?v=7";

const el = id => document.getElementById(id);
const gazda = el("pagina");
const cand = s => new Date(s).toLocaleString("ro-RO",
  { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");

let A, p;
try {
  A = await import("../js/auth.js?v=7");
  p = await A.profil();
} catch (e) {
  gazda.innerHTML = `<div class="nota"><div class="nota__et">Nu merge</div>
    <p>Nu pot încărca autentificarea: ${e.message}</p></div>`;
  throw e;
}

/* Profesorul are casa lui. Aici e contul studentului. */
if (p.profesorReal && A.modVizualizare() !== "student"){
  location.replace(RADACINA + "/profesor/");
} else if (!p.autentificat){
  gol("Contul meu",
      "Intră în cont ca să-ți văd progresul, să ți se salveze răspunsurile, și ca să apari în activitatea grupei.",
      `<a class="btn btn--tare" href="${RADACINA}/cont/">Intră în cont</a>
       <a class="btn" href="${RADACINA}/">Înapoi la curs</a>`);
} else if (!p.matricol){
  gol("Mai e un pas",
      "Ești conectat, dar contul nu e legat de un număr matricol. Fără asta nu te pot găsi în listă.",
      `<a class="btn btn--tare" href="${RADACINA}/cont/">Leagă numărul matricol</a>`);
} else {
  await deseneaza();
}

function gol(titlu, text, butoane){
  gazda.innerHTML = `<div class="gol-mare"><h1>${titlu}</h1><p>${text}</p>
    <div class="gol-mare__bt">${butoane}</div></div>`;
}

/* ====================================================================== */

async function deseneaza(){
  const invitat = A.esteInvitat(p);

  let progresBaza = new Set(), rasp = [], codul = [], prez = [], totaleBaza = new Map();
  try {
    const [g, r, c, z, s] = await Promise.all([
      A.sb.from("progres").select("sectiune_id, ultima_data"),
      A.sb.from("raspunsuri").select("intrebare_id, capitol, raspuns, corect, creat_la")
          .order("creat_la", { ascending:false }),
      A.sb.from("rulari_cod").select("exercitiu_id, cod, trecut, creat_la")
          .order("creat_la", { ascending:false }),
      A.sb.from("prezente").select("curs, marcat_la"),
      A.sb.from("sesiuni").select("capitol, total_nr")
    ]);
    (g.data || []).forEach(x => progresBaza.add(x.sectiune_id));
    rasp = r.data || []; codul = c.data || []; prez = z.data || [];
    (s.data || []).forEach(x => { if (x.capitol && x.total_nr)
      totaleBaza.set(x.capitol, Math.max(totaleBaza.get(x.capitol) || 0, x.total_nr)); });
  } catch { /* fără rețea, rămâne ce știe browserul */ }

  const harta = c => { try { return JSON.parse(localStorage.getItem(`dsw.harta.${c}`) || "null"); }
                       catch { return null; } };
  const local = c => { try { return new Set(JSON.parse(
                         localStorage.getItem(`dsw.parcurs.${c}`) || "{}").vizitate || []); }
                       catch { return new Set(); } };

  const lectii = LECTII.map(l => {
    const cheie = "c" + l.nr, h = harta(cheie), viz = local(cheie);
    progresBaza.forEach(k => { const m = new RegExp(`^${cheie}/s(\\d+)$`).exec(k);
                               if (m) viz.add(+m[1] - 1); });
    const total = (h && h.total) || totaleBaza.get(cheie) || null;
    const q = rasp.filter(x => x.capitol === cheie);
    /* exercițiile cu cod n-au coloană de capitol; o citim din id: „c1-cod-…" */
    const cod = codul.filter(x => x.trecut && String(x.exercitiu_id).startsWith(cheie + "-"));
    const facute = new Set(q.map(x => x.intrebare_id)).size
                 + new Set(cod.map(x => x.exercitiu_id)).size;
    const qTotal = l.sarcini
      || (h ? h.verif.reduce((a, x) => a + (Array.isArray(x) ? x.length : x), 0) : null);
    return { l, cheie, total, viz,
             vazute: Math.min(viz.size, total || viz.size),
             ultim: viz.size ? Math.max(...viz) + 1 : 0,
             qDate: facute, qCorecte: q.filter(x => x.corect).length, qTotal };
  });

  /* --- notarea, din NOTARE, nu din cifre scrise de mână -----------------
     O sarcină se pune la socoteală o singură dată, oricâte încercări au fost
     nevoie: contează că ai ajuns la capăt, nu că ai nimerit din prima. */
  const sarciniFacute =
      new Set(rasp.map(x => x.intrebare_id)).size +
      new Set(codul.filter(x => x.trecut).map(x => x.exercitiu_id)).size;
  const sarciniTotal = LECTII.reduce((a, l) => a + (l.sarcini || 0), 0) || null;
  const pTeme    = NOTARE.componente.find(x => x.cheie === "teme").puncte;
  const pProiect = NOTARE.componente.find(x => x.cheie === "proiect").puncte;
  const pSem     = NOTARE.componente.find(x => x.cheie === "seminar").puncte;
  const temeAcum = sarciniTotal
    ? Math.round(Math.min(1, sarciniFacute / sarciniTotal) * pTeme * 10) / 10 : null;
  const semAcum  = Math.round(Math.min(1, prez.length / LECTII.length) * pSem * 10) / 10;

  const totSlide = lectii.reduce((a, x) => a + (x.total || 0), 0);
  const totVaz   = lectii.reduce((a, x) => a + x.vazute, 0);
  const proc = totSlide ? Math.round(totVaz / totSlide * 100) : 0;
  const urm = lectii.find(x => x.l.stare === "gata" && x.total && x.vazute < x.total)
           || lectii.find(x => x.l.stare === "gata");
  const ini = (p.nume || "?").trim().split(/\s+/).slice(0,2).map(x => x[0] || "").join("").toUpperCase();

  gazda.innerHTML = `
  <header class="cnt__cap">
    <div class="cnt__cerc" style="--p:${proc}"><i>${ini}</i></div>
    <div class="cnt__cine">
      <h1>${esc(p.nume) || "Contul meu"}</h1>
      <p class="cnt__meta">
        <span class="et">${esc(p.matricol)}</span>
        ${p.grupa ? `<span class="et">grupa ${esc(p.grupa)}</span>` : ""}
        ${invitat ? `<span class="et et--nu">invitat</span>` : ""}
        ${p.github_login ? `<span class="et">@${esc(p.github_login)}</span>` : ""}
      </p>
    </div>
    <div class="cnt__act">
      ${p.profesorReal ? `<a class="btn btn--mic" href="${RADACINA}/profesor/">Zona mea de profesor</a>` : ""}
      <button class="btn btn--mic" id="bt-iesi" type="button">Ieși din cont</button>
    </div>
  </header>

  ${invitat ? `<div class="nota" style="margin-bottom:30px">
    <div class="nota__et">Cont de invitat</div>
    <p>Progresul se salvează și se vede la profesor, dar contul nu e legat de un
    număr matricol și nu se poate transforma mai târziu. Dacă ești student la
    curs, ieși și intră cu GitHub.</p></div>` : ""}

  <!-- ------------------------------------------------ unde ai rămas ---- -->
  ${urm ? `<a class="reia" href="${RADACINA}/${urm.l.cheie}/${urm.total ? "lectie/#" + Math.max(1, urm.ultim) : ""}">
    <span class="reia__et">${urm.vazute ? "Continuă de unde ai rămas" : "Începe"}</span>
    <span class="reia__t">Cursul ${urm.l.nr}. ${urm.l.titlu}</span>
    <span class="reia__d">${urm.total
      ? `slide ${Math.max(1, urm.ultim)} din ${urm.total}`
      : "nu l-ai deschis încă"}</span>
    <span class="reia__b"><i style="width:${urm.total ? urm.vazute / urm.total * 100 : 0}%"></i></span>
    <span class="reia__sg">→</span>
  </a>` : ""}

  <!-- ----------------------------------------------------- notarea ----- -->
  <section class="cnt__s">
    <h2>Nota</h2>
    <p class="cnt__d">${NOTARE.total} puncte, din trei surse. Mai jos e unde stai
    acum la fiecare. Temele și seminarul se calculează singure, din ce ai făcut;
    proiectul îl notez eu la final.</p>

    <div class="nta">
      ${nota("teme", temeAcum, pTeme,
             sarciniTotal ? `${sarciniFacute} din ${sarciniTotal} sarcini` : "încă nimic",
             sarciniTotal ? sarciniFacute / sarciniTotal : 0)}
      ${nota("proiect", null, pProiect, "se notează la final", 0)}
      ${nota("seminar", semAcum, pSem,
             `${prez.length} din ${LECTII.length} prezențe`, prez.length / LECTII.length)}
    </div>

    <div class="nta__tot">
      <span>Acum, din ce se poate calcula</span>
      <b>${((temeAcum || 0) + semAcum).toFixed(1).replace(".", ",")}</b>
      <span>din ${(pTeme + pSem)} puncte, plus ${pProiect} de la proiect</span>
    </div>

    <details class="detalii">
      <summary>Cum se calculează fiecare</summary>
      ${NOTARE.componente.map(c => `<div class="detalii__r">
        <b>${c.nume} · ${c.puncte} ${c.puncte === 1 ? "punct" : "puncte"}</b>
        <p>${c.d}</p></div>`).join("")}
    </details>
  </section>

  <!-- ----------------------------------------------------- lecțiile ---- -->
  <section class="cnt__s">
    <h2>Lecțiile</h2>
    <div class="lect">${lectii.map(randLectie).join("")}</div>
  </section>

  <!-- --------------------------------------------------- activitatea --- -->
  <section class="cnt__s">
    <h2>Ce ai lucrat</h2>
    <div class="file" role="tablist">
      <button class="file__f on" data-f="cod" type="button">Cod <i>${codul.length}</i></button>
      <button class="file__f" data-f="verif" type="button">Verificări <i>${rasp.length}</i></button>
      <button class="file__f" data-f="prez" type="button">Prezențe <i>${prez.length}</i></button>
    </div>

    <div class="file__c" data-c="cod">${codul.length ? `
      <div class="codl">${[...new Map(codul.map(c => [c.exercitiu_id, c])).values()]
        .map(c => `<div class="codl__r ${c.trecut ? "bun" : ""}">
          <span class="codl__id">${esc(c.exercitiu_id)}</span>
          <code>${esc(c.cod)}</code>
          <span class="codl__c">${cand(c.creat_la)}</span></div>`).join("")}</div>`
      : `<p class="cnt__gol">Niciun exercițiu cu cod, încă.</p>`}</div>

    <div class="file__c" data-c="verif" hidden>${rasp.length ? `
      <table class="tabel">
        <thead><tr><th>Verificare</th><th>Lecția</th><th>Rezultat</th><th>Când</th></tr></thead>
        <tbody>${rasp.map(r => `<tr>
          <td class="mono">${esc(r.intrebare_id)}</td><td class="mono">${esc(r.capitol) || "—"}</td>
          <td>${r.corect ? '<span class="et et--ok">corect</span>'
                         : '<span class="et et--nu">greșit</span>'}</td>
          <td class="mono">${cand(r.creat_la)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="cnt__gol">Nicio verificare, încă.</p>`}</div>

    <div class="file__c" data-c="prez" hidden>${prez.length ? `
      <div class="codl">${prez.map(z => `<div class="codl__r bun">
        <span class="codl__id">${esc(z.curs)}</span>
        <code>prezent</code>
        <span class="codl__c">${cand(z.marcat_la)}</span></div>`).join("")}</div>`
      : `<p class="cnt__gol">Nicio prezență marcată. La începutul orei, scanează
         codul de pe ecran.</p>`}</div>
  </section>

  <!-- ------------------------------------------------------ resetare --- -->
  <section class="cnt__s">
    <h2>Resetare</h2>
    <div class="rst">
      <div>
        <p class="rst__t">Ia lecția de la capăt</p>
        <p class="rst__d">Se șterg slide-urile parcurse, răspunsurile și exercițiile
        de la lecția aleasă, și din browser și din contul tău. Porțile se închid la
        loc. Prezențele rămân. Nu se poate anula.</p>
      </div>
      <div class="rst__act">
        <select id="rst-lectie">
          <option value="">Toate lecțiile</option>
          ${LECTII.map(l => `<option value="c${l.nr}">Cursul ${l.nr}. ${l.titlu}</option>`).join("")}
        </select>
        <button class="btn btn--mic rst__bt" id="rst-bt" type="button">Resetează</button>
      </div>
      <p class="rst__msg" id="rst-msg"></p>
    </div>
  </section>`;

  el("bt-iesi").onclick = async () => { await A.iesi(); location.href = RADACINA + "/"; };
  gazda.querySelectorAll(".file__f").forEach(b => b.onclick = () => {
    gazda.querySelectorAll(".file__f").forEach(x => x.classList.toggle("on", x === b));
    gazda.querySelectorAll(".file__c").forEach(x => x.hidden = x.dataset.c !== b.dataset.f);
  });
  legaReset();
}

function nota(cheie, acum, max, sub, fractie){
  const c = NOTARE.componente.find(x => x.cheie === cheie);
  const pr = Math.round(Math.min(1, fractie || 0) * 100);
  return `<div class="nt ${acum === null ? "nt--astept" : ""}">
    <span class="nt__n">${c.nume}</span>
    <span class="nt__v">${acum === null ? "—" : String(acum).replace(".", ",")}<small>/${max}</small></span>
    <span class="nt__b"><i style="width:${pr}%"></i></span>
    <span class="nt__s">${sub}</span>
    <span class="nt__d">${c.scurt}</span>
  </div>`;
}

function randLectie(x){
  const proc = x.total ? Math.round(x.vazute / x.total * 100) : 0;
  const stare = x.l.stare !== "gata" ? "în lucru"
              : !x.total             ? "nedeschisă"
              : proc >= 100          ? "parcursă"
              : `slide ${x.ultim} din ${x.total}`;
  const unde = x.total ? `${x.l.cheie}/lectie/#${Math.max(1, x.ultim)}` : `${x.l.cheie}/`;
  return `<a class="lect__r" href="${RADACINA}/${unde}">
    <span class="lect__n">${String(x.l.nr).padStart(2,"0")}</span>
    <span class="lect__m">
      <span class="lect__t">${x.l.titlu}</span>
      <span class="lect__s">${stare}${x.qTotal ? ` · sarcini ${Math.min(x.qDate, x.qTotal)}/${x.qTotal}` : ""}</span>
      <span class="lect__b"><i style="width:${proc}%"></i></span>
    </span>
    <span class="lect__p">${x.total ? proc + "%" : "—"}</span>
  </a>`;
}

function legaReset(){
  const sel = el("rst-lectie"), bt = el("rst-bt"), msg = el("rst-msg");
  bt.onclick = async () => {
    const cheie = sel.value || null;
    const unde = cheie ? `cursul ${cheie.slice(1)}` : "toate lecțiile";
    if (!confirm(`Resetezi progresul la ${unde}?\n\nSe șterg slide-urile parcurse, ` +
                 `răspunsurile și exercițiile. Nu se poate anula.`)) return;
    bt.disabled = true; bt.textContent = "Se resetează…";
    for (const l of LECTII){
      const k = "c" + l.nr;
      if (cheie && k !== cheie) continue;
      for (const pref of ["dsw.parcurs.", "dsw.raspunsuri.", "dsw.harta."]){
        try { localStorage.removeItem(pref + k); } catch {}
      }
    }
    let text = "Șters din browser.";
    try {
      const { data, error } = await A.sb.rpc("reset_progresul_meu", { p_capitol: cheie });
      text = error ? `Local s-a șters, dar în cont nu: ${error.message}`
           : data?.ok ? `Șters: ${data.progres} slide-uri, ${data.raspunsuri} răspunsuri, ${data.cod} exerciții.`
           : `Local s-a șters. ${data?.mesaj || ""}`;
    } catch (e) { text = `Local s-a șters, dar nu am ajuns la baza de date: ${e.message}`; }
    msg.textContent = text + " Reîncarc…";
    msg.classList.add("vazut");
    setTimeout(() => location.reload(), 1500);
  };
}
</script>
<script type="module" src="../js/antet.js?v=7"></script>
<script type="module" src="../js/subsol.js?v=7"></script>
<script type="module" src="../js/bara-mod.js?v=7"></script>
</body>
</html>
