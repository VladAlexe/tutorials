<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Predau</title>
<meta name="robots" content="noindex,nofollow">
<script type="module">
/* Pagina asta era casa profesorului. Acum casa e /predau/, iar studentul care
   nimerește aici n-are ce căuta: îl trimit la contul lui. Un singur loc per
   rol, altfel pare că ai două conturi deodată. */
const RAD = "/data-science-workflows";
try {
  const { profil } = await import(RAD + "/js/auth.js?v=42");
  const p = await profil();
  location.replace(p.profesorReal ? RAD + "/predau/" : RAD + "/cont/");
} catch { location.replace(RAD + "/cont/"); }
</script>
</head>
<body style="font-family:system-ui;padding:40px">
<p>S-a mutat la <a href="/data-science-workflows/predau/">/predau/</a>.</p>
</body>
</html>
