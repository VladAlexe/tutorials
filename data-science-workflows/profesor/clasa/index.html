<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panou de clasă — Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/sistem.css?v=5">
<link rel="stylesheet" href="../../css/grafice.css?v=5">
<link rel="stylesheet" href="../../css/clasa.css?v=5">
<script src="../../js/tema.js?v=5"></script>
</head>
<body class="corp--app">

<div id="antet" data-aici="Panou de clasă" data-crom="1"></div>

<div class="cls">
<div class="cls__in" id="pagina">
  <p class="incarca">Se verifică dacă ai drept de profesor…</p>
</div>
</div>

<template id="sablon">
  <div class="cls__sus">
    <span class="puls" id="puls"><i></i><span><b id="nr-live">0</b> în lecție acum</span></span>
    <label class="cls__sel">lecția
      <select id="sel-lectie"></select>
    </label>
    <div class="cls__dr">
      <span class="cls__cand" id="cand">—</span>
      <button class="btn btn--mic" id="bt-qr" type="button">cod de intrare</button>
      <button class="btn btn--mic" id="bt-pauza" type="button">pune pe pauză</button>
      <a class="btn btn--mic" href="../../profesor/">Panoul vechi</a>
    </div>
  </div>

  <div class="cifre" id="cifre"></div>

  <div class="banda">
    <div class="banda__cap"><span class="banda__t">Unde e grupa acum</span></div>
    <p class="banda__d">Fiecare nume stă pe slide-ul la care se uită chiar acum. Numele
      se estompează dacă nu s-a mai mișcat de un minut. Coloanele hașurate au
      verificare, deci acolo se adună lumea.</p>
    <div class="banda__pista" id="pista"></div>
  </div>

  <div class="cls__grila">
    <div class="pan">
      <div class="pan__cap"><span class="pan__t">Cum a răspuns grupa</span></div>
      <p class="pan__d">Pentru fiecare verificare, câți au ales fiecare variantă.
        Varianta corectă e marcată cu bifă, nu doar cu culoare. Dacă o întrebare
        are răspunsurile împrăștiate, acolo merită să te oprești la oră.</p>
      <div id="raspunsuri"><p class="pan__gol">Încă nu a răspuns nimeni.</p></div>
    </div>

    <div class="pan">
      <div class="pan__cap"><span class="pan__t">Toată grupa</span></div>
      <p class="pan__d">Inclusiv cine nu și-a făcut încă cont. Butonul de resetare
        șterge progresul și răspunsurile unui student la lecția selectată;
        jurnalul rămâne.</p>
      <div class="tb__sul"><table class="tb" id="tabel"></table></div>
    </div>
  </div>

  <div class="cls__grila" style="margin-top:16px">
    <div class="pan">
      <div class="pan__cap"><span class="pan__t">Ce au scris la exerciții</span></div>
      <p class="pan__d">Ultima rezolvare a fiecăruia, pentru fiecare exercițiu cu
        cod. Numărul din dreapta arată câte încercări a făcut până acolo.</p>
      <div id="cod"><p class="pan__gol">Încă nu a trimis nimeni cod.</p></div>
    </div>

    <div>
      <div class="pan" style="margin-bottom:16px">
        <div class="pan__cap"><span class="pan__t">Ce știe grupa</span></div>
        <p class="pan__d">Autoevaluarea de la începutul cursului, strânsă pe grupă.</p>
        <div id="autoeval"><p class="pan__gol">Încă nu s-a autoevaluat nimeni.</p></div>
      </div>
      <div class="pan">
        <div class="pan__cap"><span class="pan__t">Ce așteaptă de la curs</span></div>
        <p class="pan__d">Scris de ei, cu numele lor.</p>
        <div id="asteptari"><p class="pan__gol">Încă nu a scris nimeni.</p></div>
      </div>
    </div>
  </div>
</template>

<div class="qr" id="qr" hidden>
  <div class="qr__cutie">
    <button class="qr__x" id="qr-x" type="button" aria-label="Închide">×</button>
    <span class="qr__et">Intrare la curs</span>
    <div class="qr__cod" id="qr-cod"></div>
    <p class="qr__url" id="qr-url"></p>
    <p class="qr__d">Proiectează asta. Cine nu are cont intră ca invitat, cu
      numele lui, și apare imediat în panou.</p>
  </div>
</div>

<script type="module">
import { LECTII, RADACINA } from "../../js/curs.js?v=5";

const el = id => document.getElementById(id);
const pag = el("pagina");
const nf = new Intl.NumberFormat("ro-RO");

/* ------------------------------------------------------------ autorizare */
let sb, profilul;
try {
  const m = await import("../../js/auth.js?v=5");
  sb = m.sb;
  profilul = await m.profil();
} catch (e) {
  pag.innerHTML = `<div class="nota"><div class="nota__et">Nu merge</div>
    <p>Nu pot încărca autentificarea: ${e.message}</p></div>`;
  throw e;
}

if (!profilul.autentificat){
  pag.innerHTML = `<div class="nota"><div class="nota__et">Intră în cont</div>
    <p>Panoul de clasă e vizibil doar profesorului. Intră în cont și revino.</p>
    <a class="btn btn--tare" href="${RADACINA}/cont/" style="margin-top:10px">Intră în cont</a>
    </div>`;
} else if (!(profilul.profesor || profilul.profesorReal)){
  pag.innerHTML = `<div class="nota nota--sobru"><div class="nota__et">Doar pentru profesor</div>
    <p>Contul tău nu are drept de profesor. Dacă ar trebui să-l aibă, adaugă-l în
    tabelul <code>profesori</code> din Supabase.</p>
    <a class="btn" href="${RADACINA}/panou/" style="margin-top:10px">Mergi la panoul tău</a></div>`;
} else {
  porneste();
}

/* ------------------------------------------------------------------ panou */
function porneste(){
  pag.innerHTML = "";
  pag.appendChild(document.getElementById("sablon").content.cloneNode(true));

  const sel = el("sel-lectie");
  sel.innerHTML = LECTII.map(l =>
    `<option value="c${l.nr}">${l.nr}. ${l.titlu}</option>`).join("");

  /* harta slide-urilor lecției: titluri și care au verificare. O citim din
     chiar pagina lecției, ca să nu ținem o a doua listă care se desincronizează. */
  let harta = [];
  async function iaHarta(cheie){
    const l = LECTII.find(x => "c" + x.nr === cheie);
    harta = [];
    if (!l) return;
    try {
      const r = await fetch(`${RADACINA}/${l.cheie}/lectie/`, { cache:"no-cache" });
      if (!r.ok) return;
      const d = new DOMParser().parseFromString(await r.text(), "text/html");
      harta = [...d.querySelectorAll(".sld")].map((s, i) => ({
        nr: i + 1,
        t: s.dataset.t || `Slide ${i + 1}`,
        verif: [...s.querySelectorAll(".verif")].map(v => ({
          id: v.dataset.id,
          q: v.querySelector(".verif__q")?.textContent.trim().replace(/\s+/g, " ") || v.dataset.id,
          corect: parseInt(v.dataset.corect, 10),
          optiuni: [...v.querySelectorAll("button")].map(b => b.textContent.trim())
        }))
      }));
    } catch { /* lecția poate să nu existe încă */ }
  }

  let activ = true, ceas = null;
  el("bt-pauza").onclick = () => {
    activ = !activ;
    el("bt-pauza").textContent = activ ? "pune pe pauză" : "pornește la loc";
    el("puls").classList.toggle("rece", !activ);
    if (activ) cicleaza();
  };
  sel.onchange = async () => { await iaHarta(sel.value); reimprospateaza(); };

  async function cicleaza(){
    clearTimeout(ceas);
    if (!activ) return;
    await reimprospateaza();
    ceas = setTimeout(cicleaza, document.visibilityState === "visible" ? 5000 : 30000);
  }
  document.addEventListener("visibilitychange", () => { if (activ) cicleaza(); });

  iaHarta(sel.value).then(cicleaza);

  /* ---------------------------------------------------------- o rundă ---- */
  async function reimprospateaza(){
    const cheie = sel.value;
    const [live, prog, rasp, cod, ast, aev] = await Promise.all([
      sb.rpc("live_acum", { p_minute: 3 }),
      sb.rpc("sumar_progres", { p_capitol: cheie }),
      sb.rpc("sumar_raspunsuri", { p_capitol: cheie }),
      sb.rpc("sumar_cod", { p_exercitiu: null }),
      sb.rpc("sumar_asteptari", { p_capitol: cheie }),
      sb.rpc("sumar_autoevaluare", { p_capitol: cheie })
    ]);
    deseneazaCod(cod.data || []);
    deseneazaAsteptari(ast.data || []);
    deseneazaAutoeval(aev.data || []);
    if (live.error || prog.error || rasp.error){
      el("cand").textContent = "eroare: " + (live.error || prog.error || rasp.error).message;
      return;
    }
    const aici = (live.data || []).filter(x => x.capitol === cheie);
    deseneazaPista(aici);
    deseneazaCifre(aici, prog.data || []);
    deseneazaRaspunsuri(rasp.data || []);
    deseneazaTabel(prog.data || [], aici, cheie);
    el("nr-live").textContent = aici.length;
    el("puls").classList.toggle("rece", aici.length === 0);
    el("cand").textContent = "actualizat " +
      new Date().toLocaleTimeString("ro-RO", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  }

  /* --------------------------------------------------------- pista ------- */
  function deseneazaPista(aici){
    const n = harta.length || Math.max(1, ...aici.map(x => x.total_nr || 1));
    const peSlide = new Map();
    aici.forEach(x => {
      const k = x.slide_nr || 1;
      if (!peSlide.has(k)) peSlide.set(k, []);
      peSlide.get(k).push(x);
    });
    let h = "";
    for (let i = 1; i <= n; i++){
      const oameni = peSlide.get(i) || [];
      const s = harta[i - 1];
      h += `<div class="col ${oameni.length ? "are" : ""} ${s && s.verif.length ? "poarta" : ""}">
        <div class="col__oameni">${oameni.map(o => `
          <span class="om ${o.de_cat_timp > 60 ? "lenes" : ""}"
                title="${o.nume} · ${o.matricol} · de ${Math.round(o.de_cat_timp)} s">
            ${prenume(o.nume)}</span>`).join("")}</div>
        <span class="col__bara"></span>
        <span class="col__n">${i}</span>
        <span class="col__t">${s ? s.t : ""}</span>
      </div>`;
    }
    el("pista").innerHTML = h;
  }
  const prenume = s => (s || "").split(/\s+/)[0] || "—";

  /* --------------------------------------------------------- cifre ------- */
  function deseneazaCifre(aici, prog){
    const cuCont = prog.filter(p => p.are_cont).length;
    const incepute = prog.filter(p => p.slide_vazute > 0).length;
    const medie = incepute
      ? Math.round(prog.filter(p => p.slide_vazute > 0)
                       .reduce((a, p) => a + p.slide_max, 0) / incepute)
      : 0;
    const date = prog.reduce((a, p) => a + p.verif_date, 0);
    const corecte = prog.reduce((a, p) => a + p.verif_corecte, 0);
    el("cifre").innerHTML = `
      <div class="cif"><b>${aici.length}</b><span>în lecție acum</span></div>
      <div class="cif"><b>${incepute}/${prog.length}</b><span>au început lecția</span></div>
      <div class="cif"><b>${cuCont}/${prog.length}</b><span>au cont legat</span></div>
      <div class="cif"><b>${medie || "—"}</b><span>slide mediu</span></div>
      <div class="cif"><b>${date ? Math.round(corecte / date * 100) + "%" : "—"}</b>
        <span>răspunsuri corecte</span></div>`;
  }

  /* ----------------------------------------------------- răspunsuri ------ */
  const BIFA = `<svg class="dz__bifa" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>`;

  function deseneazaRaspunsuri(rasp){
    const intrebari = harta.flatMap(s => s.verif);
    if (!intrebari.length || !rasp.length){
      el("raspunsuri").innerHTML = `<p class="pan__gol">Încă nu a răspuns nimeni la
        verificările din lecția asta.</p>`;
      return;
    }
    const peId = new Map();
    rasp.forEach(r => {
      if (!peId.has(r.intrebare_id)) peId.set(r.intrebare_id, new Map());
      peId.get(r.intrebare_id).set(r.raspuns, r.cati);
    });

    el("raspunsuri").innerHTML = intrebari.map(q => {
      const c = peId.get(q.id);
      if (!c) return "";
      const total = [...c.values()].reduce((a, b) => a + b, 0);
      const max = Math.max(...c.values());
      const bune = c.get(q.corect) || 0;
      return `<div class="dz">
        <div class="dz__cap"><span class="dz__id">${q.id}</span>
          <span class="dz__q">${q.q}</span>
          <span class="dz__n">${total} răsp.</span></div>
        ${q.optiuni.map((o, i) => {
          const k = c.get(i) || 0;
          return `<div class="dz__r ${i === q.corect ? "bun" : ""}" title="${o}">
            <span class="dz__v">${String.fromCharCode(65 + i)}${i === q.corect ? BIFA : ""}</span>
            <span class="dz__p"><i style="width:${max ? (k / max * 100).toFixed(1) : 0}%"></i></span>
            <span class="dz__e">${k}</span></div>`;
        }).join("")}
        <div class="dz__e" style="margin-top:5px">corect: <b>${bune}</b> din ${total}
          (${total ? Math.round(bune / total * 100) : 0}%)</div>
      </div>`;
    }).join("") || `<p class="pan__gol">Încă nu a răspuns nimeni.</p>`;
  }

  /* ------------------------------------------------- ce au scris ei ------ */
  const cand = s => new Date(s).toLocaleString("ro-RO",
    { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });

  function deseneazaCod(randuri){
    if (!randuri.length){
      el("cod").innerHTML = `<p class="pan__gol">Încă nu a trimis nimeni cod.</p>`;
      return;
    }
    const peEx = new Map();
    randuri.forEach(r => {
      if (!peEx.has(r.exercitiu_id)) peEx.set(r.exercitiu_id, []);
      peEx.get(r.exercitiu_id).push(r);
    });
    el("cod").innerHTML = [...peEx].map(([ex, lst]) => `
      <div class="cod__g">
        <div class="cod__gt"><span class="cod__id">${ex}</span>
          <span class="cod__n">${lst.filter(x => x.trecut).length}/${lst.length} au trecut</span></div>
        ${lst.map(r => `<div class="cod__r ${r.trecut ? "bun" : "rau"}">
          <span class="cod__cine">${r.nume}<small>${r.matricol}</small></span>
          <code class="cod__t">${(r.cod || "").replace(/</g, "&lt;")}</code>
          <span class="cod__i" title="încercări">${r.incercari}×</span>
        </div>`).join("")}
      </div>`).join("");
  }

  function deseneazaAsteptari(randuri){
    if (!randuri.length){
      el("asteptari").innerHTML = `<p class="pan__gol">Încă nu a scris nimeni.</p>`;
      return;
    }
    el("asteptari").innerHTML = `<div class="ast__lista">` + randuri.map(r => `
      <blockquote class="ast__c">
        <p>${(r.text || "").replace(/</g, "&lt;")}</p>
        <footer>${r.nume}<span>${r.matricol}${r.grupa ? " · " + r.grupa : ""} · ${cand(r.creat_la)}</span></footer>
      </blockquote>`).join("") + `</div>`;
  }

  const ETICHETE_AEV = { python:"Python", linie:"Linia de comandă", git:"Git",
                         sql:"SQL", api:"API-uri", stat:"Statistică" };
  const NIVELE_AEV = ["n-am auzit", "am citit", "am folosit", "folosesc des"];

  function deseneazaAutoeval(randuri){
    if (!randuri.length){
      el("autoeval").innerHTML = `<p class="pan__gol">Încă nu s-a autoevaluat nimeni.</p>`;
      return;
    }
    const pe = new Map();
    randuri.forEach(r => {
      if (!pe.has(r.tema)) pe.set(r.tema, [0, 0, 0, 0]);
      pe.get(r.tema)[r.nivel] = r.cati;
    });
    el("autoeval").innerHTML = `
      <div class="aev__legenda">${NIVELE_AEV.map((n, i) =>
        `<span><i class="n${i}"></i>${n}</span>`).join("")}</div>
      ${[...pe].map(([tema, v]) => {
        const tot = v.reduce((a, b) => a + b, 0) || 1;
        return `<div class="aev__b">
          <span class="aev__bt">${ETICHETE_AEV[tema] || tema}</span>
          <span class="aev__bp">${v.map((k, i) => k
            ? `<i class="n${i}" style="width:${k / tot * 100}%" title="${NIVELE_AEV[i]}: ${k}"></i>`
            : "").join("")}</span>
          <span class="aev__bn">${tot}</span></div>`;
      }).join("")}`;
  }

  /* ------------------------------------------------------------ codul QR -- */
  const adresaIntrare = location.origin + RADACINA + "/intra/";
  el("qr-url").textContent = adresaIntrare.replace(/^https?:\/\//, "");
  el("bt-qr").onclick = () => { el("qr").hidden = false; faQr(); };
  el("qr-x").onclick = () => { el("qr").hidden = true; };
  el("qr").onclick = e => { if (e.target === el("qr")) el("qr").hidden = true; };

  let qrFacut = false;
  async function faQr(){
    if (qrFacut) return;
    const g = el("qr-cod");
    try {
      const { default: qrcode } =
        await import("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm");
      const q = qrcode(0, "M");
      q.addData(adresaIntrare);
      q.make();
      g.innerHTML = q.createSvgTag({ cellSize: 7, margin: 2, scalable: true });
      qrFacut = true;
    } catch {
      /* fără rețea către CDN, adresa scrisă mare e la fel de utilă */
      g.innerHTML = `<p class="qr__fallback">${adresaIntrare.replace(/^https?:\/\//, "")}</p>`;
      qrFacut = true;
    }
  }

  /* ---------------------------------------------------------- tabel ------ */
  function deseneazaTabel(prog, aici, cheie){
    const live = new Set(aici.map(x => x.matricol));
    const total = harta.length || 1;
    el("tabel").innerHTML = `
      <thead><tr><th></th><th>Student</th><th>Gr.</th><th>Slide</th>
        <th>Corecte/date</th><th>Ultima dată</th><th></th></tr></thead>
      <tbody>${prog.map(p => `<tr>
        <td class="n">${live.has(p.matricol)
          ? '<span style="color:var(--ok)">●</span>' : ""}</td>
        <td class="nume">${p.nume}<br><span class="mic">${p.matricol}${
          p.are_cont ? "" : " · fără cont"}</span></td>
        <td class="n">${p.grupa || "—"}</td>
        <td class="n">${p.slide_max || 0}/${total}
          <span class="tb__bara"><i style="width:${Math.min(100, p.slide_max / total * 100)}%"></i></span></td>
        <td class="n">${p.verif_date ? `${p.verif_corecte}/${p.verif_date}` : "—"}</td>
        <td class="mic">${p.ultima_data
          ? new Date(p.ultima_data).toLocaleString("ro-RO",
              { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })
          : "—"}</td>
        <td>${p.are_cont
          ? `<button class="rst" data-rst="${p.matricol}" type="button">resetează</button>`
          : ""}</td></tr>`).join("")}</tbody>`;

    el("tabel").querySelectorAll("[data-rst]").forEach(b => b.onclick = async () => {
      const m = b.dataset.rst;
      if (!confirm(`Resetezi progresul lui ${m} la lecția ${cheie}?\n\n` +
                   `Se șterg progresul și răspunsurile de la lecția asta. ` +
                   `Jurnalul rămâne. Nu se poate anula.`)) return;
      b.disabled = true; b.textContent = "…";
      const { data, error } = await sb.rpc("reset_student",
        { p_matricol:m, p_capitol:cheie });
      if (error || !data?.ok) alert("Nu a mers: " + (error?.message || data?.mesaj));
      reimprospateaza();
    });
  }
}
</script>
<script type="module" src="../../js/antet.js?v=5"></script>
</body>
</html>
