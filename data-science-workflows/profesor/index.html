<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona profesorului — Fluxuri de lucru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sistem.css?v=7">
<link rel="stylesheet" href="../css/clasa.css?v=7">
<link rel="stylesheet" href="../css/profesor.css?v=7">
<script src="../js/tema.js?v=7"></script>
</head>
<body>

<div id="antet" data-aici="Zona profesorului"></div>

<main>
<div class="pagina">
  <div id="pagina"><p class="incarca">Se verifică dacă ai drept de profesor…</p></div>
</div>
</main>

<!-- codul de intrare, proiectat pe ecran la începutul orei -->
<div class="qr" id="qr" hidden>
  <div class="qr__cutie">
    <button class="qr__x" id="qr-x" type="button" aria-label="Închide">×</button>
    <span class="qr__et">Prezență la curs</span>
    <div class="qr__cod" id="qr-cod"></div>
    <p class="qr__jeton" id="qr-jeton"></p>
    <p class="qr__url" id="qr-url"></p>
    <p class="qr__d">Proiectează asta. Cine are cont intră cu GitHub și prezența
      se leagă de numărul matricol; cine nu are, intră ca invitat. În amândouă
      cazurile prezența se marchează singură.</p>
  </div>
</div>

<div id="subsol"></div>

<script type="module">
import { LECTII, NOTARE, RADACINA, CURS } from "../js/curs.js?v=7";

const el  = id => document.getElementById(id);
const pag = el("pagina");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ora = s => s ? new Date(s).toLocaleString("ro-RO",
  { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) : "—";
const unZec = n => (Math.round(n * 10) / 10).toFixed(1).replace(".", ",");

let A, sb, p;
try {
  A = await import("../js/auth.js?v=7");
  sb = A.sb;
  p  = await A.profil();
} catch (e) {
  pag.innerHTML = `<div class="nota"><div class="nota__et">Nu merge</div>
    <p>Nu pot încărca autentificarea: ${e.message}</p></div>`;
  throw e;
}

/* --- ușa: aici intră un singur om ---------------------------------------- */
if (!p.autentificat){
  pag.innerHTML = `<div class="gol-mare"><h1>Zona profesorului</h1>
    <p>Intră în cont ca să ajungi aici.</p>
    <div class="gol-mare__bt"><a class="btn btn--tare" href="${RADACINA}/cont/">Intră în cont</a></div></div>`;
} else if (!p.profesorReal){
  /* Studenții nu află de aici ce e dincolo de ușă: primesc drumul înapoi. */
  pag.innerHTML = `<div class="gol-mare"><h1>Pagina asta nu e pentru tine</h1>
    <p>Contul tău e de student. Progresul, notele și lecțiile sunt la contul tău.</p>
    <div class="gol-mare__bt">
      <a class="btn btn--tare" href="${RADACINA}/panou/">Contul meu</a>
      <a class="btn" href="${RADACINA}/">Pagina cursului</a></div></div>`;
} else {
  await deseneaza();
}

/* ========================================================================= */

async function deseneaza(){
  const gata = LECTII.filter(l => l.stare === "gata");
  const aleasa = (() => {
    try { return localStorage.getItem("dsw.prof.lectie") || gata[0]?.cheie; }
    catch { return gata[0]?.cheie; }
  })();

  pag.innerHTML = `
  <header class="pf__cap">
    <div>
      <span class="pf__et">Zona profesorului</span>
      <h1>${esc(p.nume) || "Bun venit"}</h1>
      <p class="pf__d">${esc(CURS.titlu)}. Pagina asta o vezi numai tu:
      studenții au contul lor, cu lecțiile și nota lor, și nu văd nimic de aici.</p>
    </div>
    <div class="pf__act">
      <button class="btn btn--mic" id="bt-student" type="button">Vezi site-ul ca student</button>
      <button class="btn btn--mic" id="bt-iesi" type="button">Ieși din cont</button>
    </div>
  </header>

  <!-- ============================================================ ORA === -->
  <section class="pf__s">
    <div class="pf__st"><h2>Ora de acum</h2>
      <select id="sel-lectie" class="pf__sel">
        ${LECTII.map(l => `<option value="${l.cheie}" ${l.cheie === aleasa ? "selected" : ""}
          ${l.stare === "gata" ? "" : "disabled"}>Cursul ${l.nr}. ${l.titlu}${
            l.stare === "gata" ? "" : " (în lucru)"}</option>`).join("")}
      </select>
    </div>

    <div class="ora">
      <!-- 1. prezența -->
      <div class="ora__p">
        <span class="ora__n">1</span>
        <div class="ora__m">
          <b>Deschide prezența</b>
          <p>Proiectezi codul, ei îl scanează. Merge și pentru cine are cont,
          și pentru invitați.</p>
          <div class="ora__b">
            <button class="btn btn--tare btn--mic" id="bt-qr" type="button">Arată codul</button>
            <span class="ora__c" id="c-prez">—</span>
          </div>
        </div>
      </div>

      <!-- 2. ora condusă -->
      <div class="ora__p">
        <span class="ora__n">2</span>
        <div class="ora__m">
          <b>Condu ora</b>
          <p>Cât timp e pornită, toți sar pe slide-ul tău. Oricine poate ieși
          din ritm și se poate întoarce.</p>
          <div class="ora__b">
            <button class="btn btn--mic" id="bt-ritm" type="button">Se încarcă…</button>
            <span class="ora__c" id="c-ritm">—</span>
          </div>
        </div>
      </div>

      <!-- 3. ecranele -->
      <div class="ora__p">
        <span class="ora__n">3</span>
        <div class="ora__m">
          <b>Cele două ecrane</b>
          <p>Lecția pe proiector, panoul de clasă pe laptopul tău. Se deschid
          în file separate.</p>
          <div class="ora__b">
            <a class="btn btn--mic" id="lk-lectie" target="_blank" rel="noopener">Lecția</a>
            <a class="btn btn--mic" id="lk-clasa" target="_blank" rel="noopener">Panoul de clasă</a>
          </div>
        </div>
      </div>
    </div>

    <div class="cifre" id="cifre">
      <div class="cif"><b id="k-live">—</b><span>în lecție acum</span></div>
      <div class="cif"><b id="k-prez">—</b><span>prezenți azi</span></div>
      <div class="cif"><b id="k-conturi">—</b><span>conturi legate</span></div>
      <div class="cif"><b id="k-asteptari">—</b><span>așteptări scrise</span></div>
    </div>
  </section>

  <!-- ========================================================== NOTELE === -->
  <section class="pf__s">
    <div class="pf__st"><h2>Notele grupei</h2>
      <span class="pf__mic">${NOTARE.componente.map(c =>
        `${c.nume.toLowerCase()} ${c.puncte}`).join(" · ")} · total ${NOTARE.total}</span>
    </div>
    <p class="pf__dd">Temele și seminarul se adună singure din ce au făcut.
    Proiectul îl pui tu, la final; coloana lui stă goală până atunci.</p>
    <div id="note"><p class="pan__gol">Se încarcă…</p></div>
  </section>

  <!-- ======================================================= CONTURILE === -->
  <section class="pf__s">
    <div class="pf__st"><h2>Conturile de profesor</h2></div>
    <p class="pf__dd">Dreptul de profesor stă pe cont, nu pe persoană. Poți avea
    un cont numai pentru predat, fără număr matricol și fără progres de student:
    intră o dată pe site cu el, apoi scrie-i adresa aici.</p>
    <div id="prof"><p class="pan__gol">Se încarcă…</p></div>
  </section>

  <!-- ====================================================== AȘTEPTĂRILE === -->
  <section class="pf__s">
    <div class="pf__st"><h2>Ce așteaptă de la curs</h2></div>
    <p class="pf__dd">Scris de ei, la primul slide al primei lecții.</p>
    <div id="ast"><p class="pan__gol">Se încarcă…</p></div>
  </section>`;

  el("bt-iesi").onclick = async () => { await A.iesi(); location.href = RADACINA + "/"; };
  el("bt-student").onclick = () => {
    A.setModVizualizare("student");
    location.href = RADACINA + "/panou/";
  };
  el("sel-lectie").onchange = e => {
    try { localStorage.setItem("dsw.prof.lectie", e.target.value); } catch {}
    legaLectia(); ritmStare(); numara();
  };
  el("qr-x").onclick = () => el("qr").hidden = true;
  el("bt-qr").onclick = aratCod;
  el("bt-ritm").onclick = comutaRitm;

  legaLectia();
  await Promise.all([numara(), ritmStare(), note(), asteptari(), conturi()]);
  setInterval(() => { if (!document.hidden) numara(); }, 15000);
}

/* declarate ca `function`, nu `const`: deseneaza() le cheamă înainte ca
   modulul să ajungă aici, iar o săgeată într-un const n-ar exista încă */
function lectia(){ return el("sel-lectie").value; }
function capitol(){ return "c" + (LECTII.find(l => l.cheie === lectia())?.nr || 1); }

function legaLectia(){
  el("lk-lectie").href = `${RADACINA}/${lectia()}/lectie/`;
  el("lk-clasa").href  = `${RADACINA}/profesor/clasa/`;
}

/* --------------------------------------------------------------- cifrele -- */

async function numara(){
  const c = capitol();
  const pune = (id, v) => { const n = el(id); if (n) n.textContent = v; };
  try {
    const [lv, pz, nt, as] = await Promise.all([
      sb.rpc("live_acum", { p_minute: 3 }),
      sb.rpc("sumar_prezenta", { p_curs: c }),
      sb.rpc("sumar_note"),
      sb.rpc("sumar_asteptari", { p_capitol: c })
    ]);
    const live = (lv.data || []).filter(x => x.capitol === c).length;
    pune("k-live", live);
    pune("k-prez", (pz.data || []).length);
    pune("k-conturi", (nt.data || []).filter(x => x.are_cont).length);
    pune("k-asteptari", (as.data || []).length);
    const np = (pz.data || []).length;
    el("c-prez").textContent = np
      ? `${np} ${np === 1 ? "a scanat" : "au scanat"}` : "n-a scanat nimeni încă";
  } catch { pune("k-live", "—"); }
}

/* ------------------------------------------------------------ ora condusă -- */

var ritmPornit = false;   /* var: se foloseste din deseneaza(), chemata mai sus */

async function ritmStare(){
  try {
    const { data } = await sb.rpc("citeste_ritm", { p_capitol: capitol() });
    ritmPornit = !!data?.pornit;
    el("c-ritm").textContent = ritmPornit
      ? `toți sunt pe slide-ul ${data.slide_nr}` : "fiecare în ritmul lui";
  } catch {
    ritmPornit = false;
    el("c-ritm").textContent = "nu e pornită (rulează db/08-ritm.sql)";
  }
  el("bt-ritm").textContent = ritmPornit ? "Oprește ora" : "Pornește ora condusă";
  el("bt-ritm").classList.toggle("btn--tare", !ritmPornit);
}

async function comutaRitm(){
  const b = el("bt-ritm"); b.disabled = true;
  try {
    const { data, error } = await sb.rpc("pune_ritm", {
      p_capitol: capitol(), p_slide_nr: 1, p_total_nr: null, p_pornit: !ritmPornit });
    if (error) throw error;
    if (data?.ok === false) el("c-ritm").textContent = data.mesaj;
  } catch (e) { el("c-ritm").textContent = e.message; }
  b.disabled = false;
  await ritmStare();
}

/* ----------------------------------------------------------------- notele -- */

async function note(){
  const gazda = el("note");
  let r;
  try { r = await sb.rpc("sumar_note"); if (r.error) throw r.error; }
  catch (e) {
    gazda.innerHTML = `<p class="pan__gol">Nu pot citi notele: ${esc(e.message)}.
      Dacă scrie că funcția lipsește, rulează <code>db/09-note.sql</code> în Supabase.</p>`;
    return;
  }
  const rand = r.data || [];
  if (!rand.length){ gazda.innerHTML = `<p class="pan__gol">Lista de studenți e goală.</p>`; return; }

  const pTeme = NOTARE.componente.find(x => x.cheie === "teme").puncte;
  const pProi = NOTARE.componente.find(x => x.cheie === "proiect").puncte;
  const pSem  = NOTARE.componente.find(x => x.cheie === "seminar").puncte;
  const totalSarcini = LECTII.reduce((a, l) => a + (l.sarcini || 0), 0) || 1;
  const totalOre     = LECTII.length;

  const linii = rand.map(s => {
    const facute = (s.verif_date || 0) + (s.cod_trecut || 0);
    const teme = Math.min(1, facute / totalSarcini) * pTeme;
    const sem  = Math.min(1, (s.prezente || 0) / totalOre) * pSem;
    return { s, facute, teme, sem, acum: teme + sem };
  });

  gazda.innerHTML = `
    <div class="tb__sul"><table class="tb">
      <thead><tr>
        <th>Student</th><th>Grupa</th>
        <th>Teme <small>/${pTeme}</small></th>
        <th>Seminar <small>/${pSem}</small></th>
        <th>Proiect <small>/${pProi}</small></th>
        <th>Acum</th><th>Ultima dată</th>
      </tr></thead>
      <tbody>${linii.map(({ s, facute, teme, sem, acum }) => `<tr>
        <td class="nume">${esc(s.nume)}
          <span class="mic">${esc(s.matricol)}${s.invitat ? " · invitat" : ""}${
            s.are_cont ? "" : " · fără cont"}</span></td>
        <td class="mic">${esc(s.grupa) || "—"}</td>
        <td>${unZec(teme)}
          <span class="tb__bara"><i style="width:${Math.min(100, facute / totalSarcini * 100)}%"></i></span>
          <span class="mic">${facute}/${totalSarcini}</span></td>
        <td>${unZec(sem)} <span class="mic">${s.prezente || 0}/${totalOre} ore</span></td>
        <td class="mic">la final</td>
        <td><b>${unZec(acum)}</b> <span class="mic">din ${pTeme + pSem}</span></td>
        <td class="mic">${ora(s.ultima_data)}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
}

/* ------------------------------------------------------------ așteptările -- */

async function asteptari(){
  const gazda = el("ast");
  try {
    const { data, error } = await sb.rpc("sumar_asteptari", { p_capitol: "c1" });
    if (error) throw error;
    gazda.innerHTML = (data || []).length
      ? `<div class="ast__lista">${data.map(x => `<figure class="ast__c">
           <blockquote>${esc(x.text)}</blockquote>
           <figcaption>${esc(x.nume)}${x.grupa ? " · " + esc(x.grupa) : ""}</figcaption>
         </figure>`).join("")}</div>`
      : `<p class="pan__gol">Încă n-a scris nimeni.</p>`;
  } catch (e) {
    gazda.innerHTML = `<p class="pan__gol">Nu pot citi: ${esc(e.message)}</p>`;
  }
}

/* -------------------------------------------------- conturile de profesor -- */

async function conturi(){
  const gazda = el("prof");
  let d;
  try {
    const r = await sb.rpc("profesorii");
    if (r.error) throw r.error;
    d = r.data || [];
  } catch (e) {
    gazda.innerHTML = `<p class="pan__gol">Nu pot citi lista: ${esc(e.message)}.
      Dacă scrie că funcția lipsește, rulează <code>db/10-profesori.sql</code>.</p>`;
    return;
  }

  gazda.innerHTML = `
    <div class="tb__sul"><table class="tb">
      <thead><tr><th>Cont</th><th>De când</th><th></th></tr></thead>
      <tbody>${d.map(x => `<tr>
        <td class="nume">${esc(x.email)}${x.sunt_eu
          ? ' <span class="et">contul de pe care lucrezi acum</span>' : ""}</td>
        <td class="mic">${ora(x.de_cand)}</td>
        <td>${x.sunt_eu || d.length < 2 ? ""
          : `<button class="rst" type="button" data-sc="${esc(x.email)}">scoate</button>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="ora__b" style="margin-top:16px">
      <input id="pf-email" type="email" autocomplete="off" class="pf__sel"
             placeholder="adresa contului care devine profesor" style="max-width:320px">
      <button class="btn btn--mic" id="pf-add" type="button">Fă-l profesor</button>
      <span class="ora__c" id="pf-msg"></span>
    </div>`;

  el("pf-add").onclick = async () => {
    const v = el("pf-email").value.trim();
    if (!v){ el("pf-msg").textContent = "Scrie o adresă."; return; }
    const { data, error } = await sb.rpc("fa_profesor", { p_email: v });
    el("pf-msg").textContent = error ? error.message : (data?.mesaj || "");
    if (data?.ok) conturi();
  };
  gazda.querySelectorAll("[data-sc]").forEach(b => b.onclick = async () => {
    if (!confirm(`Scoți dreptul de profesor pentru ${b.dataset.sc}?`)) return;
    const { data, error } = await sb.rpc("scoate_profesor", { p_email: b.dataset.sc });
    el("pf-msg").textContent = error ? error.message : (data?.mesaj || "");
    conturi();
  });
}

/* --------------------------------------------------------------- codul QR -- */

var jeton = null, jetonPentru = null;   /* la fel */

async function aratCod(){
  el("qr").hidden = false;
  const c = capitol(), g = el("qr-cod");
  if (jetonPentru === c && jeton) return;

  g.innerHTML = `<p class="qr__fallback">se face codul…</p>`;
  el("qr-jeton").textContent = ""; el("qr-url").textContent = "";

  let data;
  try { ({ data } = await sb.rpc("creeaza_jeton", { p_curs: c, p_minute: 110 })); }
  catch (e) { g.innerHTML = `<p class="qr__fallback">${esc(e.message)}</p>`; return; }
  if (!data?.ok){
    g.innerHTML = `<p class="qr__fallback">${esc(data?.mesaj || "nu a mers")}</p>`;
    return;
  }

  jeton = data.jeton; jetonPentru = c;
  const adresa = `${location.origin}${RADACINA}/intra/?j=${jeton}` +
                 `&spre=${encodeURIComponent(`${RADACINA}/${lectia()}/lectie/`)}`;
  el("qr-jeton").textContent = jeton;
  el("qr-url").textContent = adresa;

  /* Codul QR se desenează cu o bibliotecă de pe internet. Dacă nu se poate
     ajunge la ea, rămâne adresa scrisă mare: se poate tasta. */
  try {
    const QR = await import("https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm");
    const url = await QR.default.toDataURL(adresa,
      { margin:1, width:460, errorCorrectionLevel:"M" });
    g.innerHTML = `<img src="${url}" alt="Cod QR pentru prezență" width="460" height="460">`;
  } catch {
    g.innerHTML = `<p class="qr__fallback">${esc(adresa)}</p>`;
  }
  numara();
}
</script>
<script type="module" src="../js/antet.js?v=7"></script>
<script type="module" src="../js/subsol.js?v=7"></script>
</body>
</html>
